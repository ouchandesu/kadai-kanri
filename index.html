            var methods = saved ? JSON.parse(saved) : DEFAULT_METHODS;    // なければデフォルト値を使う

            var sel      = document.getElementById('taskMethod');  // ドロップダウン要素を取得する
            var current  = sel.value;                              // 現在選択中の値を退避する（再選択に使う）

            sel.innerHTML = ''; // 既存のすべての選択肢を削除する

            for (var i = 0; i < methods.length; i++) {                // 提出方法の数だけループする
                var opt       = document.createElement('option');      // <option>要素を生成する
                opt.value     = methods[i];                            // 値をセットする
                opt.textContent = methods[i];                          // 表示テキストをセットする
                sel.appendChild(opt);                                  // ドロップダウンに追加する
            }

            sel.value = current;                   // 以前選択していた値を復元する
            if (sel.value === '') {                // 削除などで以前の値が存在しない場合
                sel.selectedIndex = 0;             // 先頭の選択肢を選択する
            }
        }

        // -----------------------------------------------------------------
        // renderMethodList() : 設定モーダル内の提出方法リストを再構築する
        // -----------------------------------------------------------------
        function renderMethodList() {
            var saved   = localStorage.getItem(METHODS_KEY);             // 保存データを取得する
            var methods = saved ? JSON.parse(saved) : DEFAULT_METHODS;   // なければデフォルト値を使う

            var ul = document.getElementById('methodList'); // リスト要素を取得する
            ul.innerHTML = '';                              // 既存の内容をすべて削除する

            for (var i = 0; i < methods.length; i++) {           // 提出方法の数だけループする
                var li = document.createElement('li');             // <li>要素を生成する

                var span       = document.createElement('span');  // 提出方法名を表示する<span>を生成する
                span.textContent = methods[i];                    // 提出方法名をセットする

                var btn       = document.createElement('button'); // 削除ボタンを生成する
                btn.className = 'btn-method-delete';              // スタイルクラスをセットする
                btn.textContent = '削除';                         // ボタンのテキストをセットする

                if (methods.length <= 1) {
                    btn.disabled = true; // 1件のみの場合はすべての削除ボタンを無効にする（0件になるのを防ぐ）
                }

                // クロージャでループ変数 i を正しくキャプチャして各ボタンに正しいインデックスを渡す
                btn.addEventListener('click', (function(idx) {
                    return function() { deleteMethod(idx); }; // クリック時に対応するインデックスを渡す
                })(i));

                li.appendChild(span); // 提出方法名をリストアイテムに追加する
                li.appendChild(btn);  // 削除ボタンをリストアイテムに追加する
                ul.appendChild(li);   // リストアイテムをリストに追加する
            }
        }

        // -----------------------------------------------------------------
        // loadMethods() : localStorageから提出方法を読み込み、ドロップダウンを初期化する
        // ページ初回読み込み時（DOMContentLoaded）に呼ばれる
        // -----------------------------------------------------------------
        function loadMethods() {
            var saved = localStorage.getItem(METHODS_KEY); // 保存データを確認する
            if (!saved) {
                saveMethods(DEFAULT_METHODS); // 初回起動時はデフォルト値をlocalStorageに保存する
            }
            renderMethodSelect(); // フォームのドロップダウンを構築する
        }

        // -----------------------------------------------------------------
        // openSettings() : 設定モーダルを開く
        // -----------------------------------------------------------------
        function openSettings() {
            renderMethodList();                                                          // 最新データでモーダルのリストを描画する
            document.getElementById('settingsOverlay').style.display = 'block'; // オーバーレイを表示する
            document.getElementById('settingsModal').style.display   = 'block'; // モーダル本体を表示する
        }

        // -----------------------------------------------------------------
        // closeSettings() : 設定モーダルを閉じる
        // -----------------------------------------------------------------
        function closeSettings() {
            document.getElementById('settingsOverlay').style.display = 'none'; // オーバーレイを非表示にする
            document.getElementById('settingsModal').style.display   = 'none'; // モーダル本体を非表示にする
        }

        // -----------------------------------------------------------------
        // addMethod() : 入力欄の値を新しい提出方法として追加する
        // -----------------------------------------------------------------
        function addMethod() {
            var input = document.getElementById('newMethodInput'); // 入力欄要素を取得する
            var name  = input.value.trim();                        // 前後の空白を除去する

            if (name === '') {
                alert('提出方法名を入力してください。'); // 空白の場合はアラートを表示して中断する
                return;
            }

            var saved   = localStorage.getItem(METHODS_KEY);            // 保存データを取得する
            var methods = saved ? JSON.parse(saved) : DEFAULT_METHODS;  // なければデフォルト値を使う

            // 同名の提出方法が既にある場合は追加しない
            for (var i = 0; i < methods.length; i++) {
                if (methods[i] === name) {
                    alert('「' + name + '」はすでに登録されています。'); // 重複の場合はアラートを表示する
                    return;
                }
            }

            methods.push(name);        // 新しい提出方法を末尾に追加する
            saveMethods(methods);       // localStorageに保存する
            input.value = '';           // 入力欄をクリアする
            renderMethodSelect();       // フォームのドロップダウンを更新する
            renderMethodList();         // モーダルのリストを更新する
        }

        // -----------------------------------------------------------------
        // deleteMethod(index) : 指定した提出方法を削除する
        // index: 提出方法配列のインデックス
        // -----------------------------------------------------------------
        function deleteMethod(index) {
            var saved   = localStorage.getItem(METHODS_KEY);            // 保存データを取得する
            var methods = saved ? JSON.parse(saved) : DEFAULT_METHODS;  // なければデフォルト値を使う

            if (methods.length <= 1) {
                alert('最低1つの提出方法が必要です。'); // 1件しかない場合は削除できない
                return;
            }

            methods.splice(index, 1); // 指定インデックスの要素を1件削除する
            saveMethods(methods);      // 変更後の配列をlocalStorageに保存する
            renderMethodSelect();      // フォームのドロップダウンを更新する
            renderMethodList();        // モーダルのリストを更新する
        }

        // -----------------------------------------------------------------
        // escapeHtml(str) : XSS攻撃を防ぐためHTMLの特殊文字をエスケープする
        // -----------------------------------------------------------------
        function escapeHtml(str) {
            var div = document.createElement('div');       // 一時的なdiv要素を作成する
            div.appendChild(document.createTextNode(str)); // 文字列をテキストノードとして安全に挿入する（自動エスケープされる）
            return div.innerHTML;                          // エスケープ済みのHTML文字列を返す
        }

        // ページのHTMLが読み込まれた直後に初期化処理を実行する
        // DOMContentLoadedを使うことで、HTML要素が存在する状態で安全に実行できる
        window.addEventListener('DOMContentLoaded', function () {
            loadMethods(); // 提出方法をlocalStorageから読み込んでドロップダウンを初期化する
            loadTasks();   // 課題データをlocalStorageから読み込んで一覧を表示する

            // 1分（60,000ミリ秒）ごとにカウントダウンを再計算して全表示を更新する
            // setIntervalは非同期で繰り返し実行されるため、ページを開いたまま時間が経過しても常に最新の残り時間を表示できる
            setInterval(updateAllCountdowns, 60000);
        });
    </script>

</body>
