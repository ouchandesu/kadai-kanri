<!DOCTYPE html> <!-- HTML5文書であることを宣言 -->
<html lang="ja"> <!-- 言語を日本語に設定 -->
<head>
    <meta charset="UTF-8"> <!-- 文字コードをUTF-8に指定（日本語を正しく表示するため） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- スマホでも正しく表示されるよう設定 -->
    <title>課題管理</title> <!-- ブラウザのタブに表示されるタイトル -->
    <style>
        /* ===== リセット & ベース ===== */

        /* 全要素のbox-sizingをborder-boxに統一してpadding/borderを幅に含める */
        *, *::before, *::after { box-sizing: border-box; }

        /* ページ全体のフォントとレイアウト設定 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans JP', Helvetica, Arial, sans-serif; /* モダンなシステムフォントスタック */
            max-width: 720px;          /* 横幅の最大値 */
            margin: 32px auto;         /* 上下余白を取り左右中央に配置 */
            padding: 0 20px;           /* 左右に内側の余白を追加 */
            background-color: #ffffff; /* 白背景に統一 */
            color: #111111;            /* メインテキストはほぼ黒 */
            -webkit-font-smoothing: antialiased;  /* macOS/iOSでのフォントアンチエイリアス */
            -moz-osx-font-smoothing: grayscale;   /* Firefoxでのフォントアンチエイリアス */
        }

        /* ===== 入力フォームカード ===== */

        /* フォーム全体を囲むカード */
        .form-box {
            background: #ffffff;                  /* 白背景 */
            border: 1px solid #e0e0e0;            /* 薄いグレーの枠線 */
            border-radius: 12px;                  /* 大きめの角丸でモダンに */
            padding: 28px;                        /* 内側の余白 */
            margin-bottom: 24px;                  /* 下の要素との余白 */
            box-shadow: 0 1px 4px rgba(0,0,0,0.06), 0 6px 16px rgba(0,0,0,0.04); /* 2層の影で立体感を出す */
        }

        /* 各入力項目（ラベル＋入力欄）のコンテナ */
        .form-group {
            display: flex;          /* フレックスで縦積みにする */
            flex-direction: column; /* 縦方向に並べる */
            margin-bottom: 18px;    /* 項目間の余白 */
        }

        /* ラベルのスタイル */
        label {
            font-weight: 600;          /* セミボールドで読みやすく */
            font-size: 0.875rem;       /* やや小さめにして見出し感を出す */
            margin-bottom: 6px;        /* 入力欄との間の余白 */
            color: #111111;            /* ほぼ黒の文字色 */
            letter-spacing: 0.01em;    /* 文字間隔を微調整 */
        }

        /* テキスト・日付・時刻・セレクトの共通スタイル
           ② iOS Safari対応：datetime-localは使わずdate/timeを分割して使う */
        input[type="text"],
        input[type="date"],   /* 日付ピッカー（iOS/Android/PCで確実に動作する） */
        input[type="time"],   /* 時刻ピッカー（iOS/Android/PCで確実に動作する） */
        select {
            padding: 10px 14px;          /* 入力しやすい余白 */
            border: 1.5px solid #e0e0e0; /* グレーの枠線 */
            border-radius: 6px;          /* 角を丸くする */
            font-size: 1rem;             /* 文字サイズを標準に */
            width: 100%;                 /* 横幅いっぱいに広げる */
            background: #ffffff;         /* 白背景 */
            color: #111111;              /* テキスト色 */
            -webkit-appearance: none;    /* iOSのデフォルトスタイルを無効化して統一する */
            appearance: none;            /* ブラウザデフォルトスタイルを無効化する */
            transition: border-color 0.15s; /* フォーカス時の枠線変化をなめらかにする */
        }

        /* フォーカス時は枠線を黒にして入力中を明確に示す */
        input:focus,
        select:focus {
            border-color: #000000; /* 黒枠でフォーカスを示す */
            outline: none;         /* ブラウザデフォルトのoutlineを消す */
        }

        /* ② 日付・時刻を横並びにするコンテナ（iOS Safariのため分割入力を採用） */
        .deadline-group {
            display: flex; /* 日付欄と時刻欄を横並びにする */
            gap: 10px;     /* 入力欄どうしの間に余白を入れる */
        }

        /* 日付・時刻の各フィールドをラベル付きで縦積みにするラッパー */
        .deadline-field {
            flex: 1;           /* 均等に幅を分ける */
            min-width: 0;      /* flexアイテムがはみ出さないようにする */
            display: flex;     /* 入力欄と小ラベルを縦積みにする */
            flex-direction: column; /* 縦方向に並べる */
        }

        /* 日付欄は時刻欄より横幅を広く取る（YYYY/MM/DDはHH:MMより文字が多い） */
        .deadline-field:first-child { flex: 2; }

        /* .deadline-field内の入力欄は全幅を使う */
        .deadline-field input { width: 100%; }

        /* 入力欄の下に表示する補助ラベル（「日付」「時刻（任意）」） */
        .deadline-sub-label {
            font-size: 0.7rem;   /* 小さめのフォントサイズ */
            color: #9e9e9e;      /* 薄いグレーで補足情報と示す */
            margin-top: 4px;     /* 入力欄との間に少し余白を入れる */
        }

        /* ===== ボタン共通スタイル（黒背景・白文字） ===== */
        button {
            padding: 11px 24px;          /* ボタン内側の余白 */
            background-color: #000000;   /* 黒背景 */
            color: #ffffff;              /* 白文字 */
            border: none;                /* 枠線をなくす */
            border-radius: 6px;          /* 角を丸くする */
            font-size: 0.95rem;          /* 文字サイズ */
            font-weight: 600;            /* セミボールドにする */
            cursor: pointer;             /* カーソルをポインターにする */
            touch-action: manipulation;  /* タップ時の300ms遅延を除去する */
            letter-spacing: 0.02em;      /* 文字間隔を微調整 */
            transition: background 0.15s; /* ホバー時の背景変化をなめらかにする */
        }

        /* ===== 課題リストカード ===== */

        /* 課題一覧を囲むカード */
        .list-box {
            background: #ffffff;                  /* 白背景 */
            border: 1px solid #e0e0e0;            /* 薄いグレーの枠線 */
            border-radius: 12px;                  /* 角丸 */
            padding: 24px;                        /* 内側の余白 */
            box-shadow: 0 1px 4px rgba(0,0,0,0.06), 0 6px 16px rgba(0,0,0,0.04); /* 立体感のある影 */
        }

        /* ページ・セクション見出し */
        h1 {
            font-size: 1.3rem;       /* 見出しサイズ */
            font-weight: 700;        /* ボールド */
            color: #111111;          /* ほぼ黒 */
            margin: 0 0 20px 0;      /* 上余白なし、下に余白 */
            letter-spacing: -0.01em; /* 見出しは字間を少し詰める */
        }

        h2 {
            font-size: 1.1rem;       /* サブ見出しサイズ */
            font-weight: 700;        /* ボールド */
            color: #111111;          /* ほぼ黒 */
            margin: 0 0 20px 0;      /* 上余白なし、下に余白 */
            letter-spacing: -0.01em; /* 字間を少し詰める */
        }

        /* 課題リストの箇条書きリセット */
        #taskList {
            list-style: none; /* デフォルトの黒丸を消す */
            padding: 0;       /* 左のインデントをなくす */
            margin: 0;        /* 余白をリセットする */
        }

        /* 各課題アイテムのスタイル */
        #taskList li {
            display: flex;                        /* 課題情報とボタン群を横並びにする */
            justify-content: space-between;       /* 情報を左端、ボタンを右端に配置する */
            align-items: flex-start;              /* 縦方向は上揃えにする */
            border-bottom: 1px solid #f0f0f0;     /* 細い区切り線 */
            border-left: 4px solid transparent;   /* 科目カラーバー用の領域を確保する（JSで色を設定） */
            padding: 14px 0 14px 12px;            /* 上下と左に余白（左のpadding=カラーバーとの間隔） */
            line-height: 1.6;                     /* 行間を広くして読みやすくする */
        }

        /* 最後のアイテムは区切り線を非表示にする */
        #taskList li:last-child { border-bottom: none; }

        /* ===== カウントダウン表示（「あと〇日〇時間」） ===== */

        /* カウントダウンテキスト共通スタイル */
        .task-countdown {
            font-size: 0.8rem;    /* 小さめのフォントサイズ */
            font-weight: 700;     /* ボールドで目立たせる */
            margin-top: 4px;      /* 期限テキストとの間に余白を取る */
            display: inline-block; /* インラインで表示する */
        }

        .countdown-urgent  { color: #e53935; } /* 3日以内：赤 */
        .countdown-warning { color: #fb8c00; } /* 7日以内：オレンジ */
        .countdown-normal  { color: #43a047; } /* それ以外：緑 */
        .countdown-overdue { color: #bdbdbd; } /* 期限切れ：薄いグレー */

        /* 課題情報（授業名・課題名・期限など）をまとめるコンテナ */
        .task-info {
            flex: 1;    /* ボタン群以外の横幅をすべて使う */
            min-width: 0; /* flexアイテムがはみ出さないようにする */
        }

        /* 完了・編集・削除ボタンをまとめるコンテナ */
        .btn-group {
            display: flex;           /* ボタンを横並びにする */
            flex-direction: row;     /* 横方向に並べる */
            align-items: flex-start; /* 縦方向は上揃えにする */
            flex-shrink: 0;          /* ボタン群が縮まないようにする */
            margin-left: 12px;       /* 課題情報テキストとの間に余白を取る */
            gap: 6px;                /* ボタン間の隙間 */
        }

        /* ===== 課題アイテム内の各ボタン（小型サイズ） ===== */

        /* 完了ボタン（黒背景・白文字） */
        .btn-done {
            padding: 5px 12px;           /* ボタン内側の余白（小型） */
            background: #000000;         /* 黒背景 */
            color: #ffffff;              /* 白文字 */
            border: none;                /* 枠線なし */
            border-radius: 4px;          /* 角を丸くする */
            font-size: 0.78rem;          /* 小さめの文字サイズ */
            font-weight: 600;            /* セミボールド */
            cursor: pointer;             /* カーソルをポインターにする */
            touch-action: manipulation;  /* タップ遅延を除去する */
            white-space: nowrap;         /* テキストを折り返さない */
            transition: background 0.15s; /* ホバー変化をなめらかにする */
        }

        /* 未完了ボタン（グレー背景・黒文字：「元に戻す」操作を示す） */
        .btn-undone {
            padding: 5px 12px;           /* ボタン内側の余白 */
            background: #f0f0f0;         /* ライトグレーの背景 */
            color: #555555;              /* ダークグレーの文字色 */
            border: none;                /* 枠線なし */
            border-radius: 4px;          /* 角を丸くする */
            font-size: 0.78rem;          /* 小さめの文字サイズ */
            font-weight: 600;            /* セミボールド */
            cursor: pointer;             /* カーソルをポインターにする */
            touch-action: manipulation;  /* タップ遅延を除去する */
            white-space: nowrap;         /* テキストを折り返さない */
            transition: background 0.15s; /* ホバー変化をなめらかにする */
        }

        /* 編集ボタン（アウトライン：白背景・黒枠・黒文字） */
        .btn-edit {
            padding: 5px 12px;            /* ボタン内側の余白 */
            background: #ffffff;          /* 白背景でアクションの差別化 */
            color: #000000;               /* 黒文字 */
            border: 1.5px solid #000000;  /* 黒枠線でアウトラインスタイルにする */
            border-radius: 4px;           /* 角を丸くする */
            font-size: 0.78rem;           /* 小さめの文字サイズ */
            font-weight: 600;             /* セミボールド */
            cursor: pointer;              /* カーソルをポインターにする */
            touch-action: manipulation;   /* タップ遅延を除去する */
            white-space: nowrap;          /* テキストを折り返さない */
            transition: background 0.15s; /* ホバー変化をなめらかにする */
        }

        /* 削除ボタン（薄いアウトライン：白背景・グレー枠・グレー文字） */
        .btn-delete {
            padding: 5px 12px;           /* ボタン内側の余白 */
            background: #ffffff;         /* 白背景 */
            color: #555555;              /* ダークグレーの文字色 */
            border: 1.5px solid #e0e0e0; /* 薄いグレー枠線で控えめに示す */
            border-radius: 4px;          /* 角を丸くする */
            font-size: 0.78rem;          /* 小さめの文字サイズ */
            font-weight: 600;            /* セミボールド */
            cursor: pointer;             /* カーソルをポインターにする */
            touch-action: manipulation;  /* タップ遅延を除去する */
            white-space: nowrap;         /* テキストを折り返さない */
            transition: background 0.15s, border-color 0.15s; /* ホバー変化をなめらかにする */
        }

        /* ===== 課題テキスト ===== */

        /* 授業名を小さめに表示する（科目色はJSのinlineスタイルで設定） */
        .task-subject {
            font-size: 0.75rem;      /* 課題名より小さいフォントサイズ */
            font-weight: 600;        /* セミボールドにする */
            margin-bottom: 2px;      /* 課題名との間に余白を入れる */
            letter-spacing: 0.01em;  /* 文字間隔を微調整 */
        }

        /* 課題名のスタイル */
        .task-name {
            font-size: 1rem;    /* 標準フォントサイズ */
            font-weight: 700;   /* ボールドで強調する */
            color: #111111;     /* ほぼ黒 */
        }

        /* 期限・提出方法などのサブ情報 */
        .task-detail {
            font-size: 0.82rem; /* 小さめのフォントサイズ */
            color: #777777;     /* 薄いグレーの文字色 */
            margin-top: 3px;    /* 上に少し余白を取る */
        }

        /* 課題が0件のときのメッセージ */
        .empty-message {
            color: #bdbdbd;      /* 薄いグレー文字 */
            font-style: italic;  /* 斜体にして補足情報と示す */
            padding: 12px 0;     /* 上下に余白 */
        }

        /* 完了済みアイテム全体のスタイル */
        #taskList li.task-completed {
            background-color: #f8f8f8; /* ライトグレー背景で完了済みを示す */
            border-radius: 6px;        /* 背景色が付いたので角を丸くする */
            padding-right: 8px;        /* 右側にも余白を追加する */
        }

        /* 完了済みアイテムの課題名に取り消し線を入れる */
        #taskList li.task-completed .task-name {
            text-decoration: line-through; /* 取り消し線を入れる */
            color: #bdbdbd;                /* 薄いグレーで完了済みを示す */
        }

        /* =======================================================
           スマホ向けレスポンシブ（max-width: 600px）
           ======================================================= */
        @media (max-width: 600px) {

            /* 上下余白を縮小してスクロール量を減らす */
            body {
                margin: 12px auto; /* PC(32px)→スマホ(12px)に縮小する */
                padding: 0 12px;   /* 左右余白もスマホ向けに縮小する */
            }

            /* フォームカードの余白を縮小する */
            .form-box {
                padding: 18px;       /* PC(28px)→スマホ(18px)に縮小する */
                margin-bottom: 16px; /* PC(24px)→スマホ(16px)に縮小する */
            }

            /* リストカードの余白も縮小する */
            .list-box { padding: 16px; }

            /* 見出しサイズをスマホ幅に合わせて縮小する */
            h1 { font-size: 1.2rem; }
            h2 { font-size: 1rem; }

            /* ② iOSの自動ズーム防止：フォントサイズを16px以上にする */
            input[type="text"],
            input[type="date"],
            input[type="time"],
            select {
                font-size: 16px;    /* 16px未満だとiOSが自動ズームするため必須 */
                padding: 11px 12px; /* タップしやすい縦paddingに拡大する */
            }

            /* ② スマホでは日付・時刻欄を縦並びにして横幅を最大限活用する */
            .deadline-group {
                flex-direction: column; /* 横並び→縦並びに切り替える */
                gap: 8px;              /* 縦並び時の間隔 */
            }

            /* 縦並び時は各フィールドを全幅に広げる */
            .deadline-field {
                flex: none !important; /* flex比率を無効にする */
                width: 100%;           /* 全幅に広げる */
            }

            /* 登録・更新ボタンを全幅に広げてタップしやすくする */
            #submitBtn {
                width: 100%;     /* 全幅に広げる */
                padding: 14px 0; /* 縦paddingを大きくして44px以上のタッチ領域を確保する */
            }

            /* スマホでは課題情報とボタン群を縦並びにする */
            #taskList li {
                flex-direction: column;  /* 横並び→縦並びに切り替える */
                align-items: flex-start; /* 左端に揃える */
            }

            /* ボタン群を課題情報の下に配置する */
            .btn-group {
                margin-left: 0;  /* 縦並び時は左マージン不要 */
                margin-top: 10px; /* 課題情報との間に余白を入れる */
                width: 100%;     /* 全幅に広げる */
                gap: 6px;        /* ボタン間の隙間 */
            }

            /* 各課題ボタンを均等幅でタッチしやすく拡大する */
            .btn-done, .btn-undone, .btn-edit, .btn-delete {
                flex: 1;            /* 均等に横幅を分ける */
                padding: 11px 0;    /* 縦paddingを増やして44px以上のタッチ領域を確保する */
                text-align: center; /* テキストを中央に揃える */
                min-height: 44px;   /* Appleガイドラインの最小タッチターゲット高さ */
                font-size: 0.85rem; /* 読みやすいサイズに調整する */
            }
        }

        /* =======================================================
           ホバー効果（マウスを持つデバイス専用）
           hover: hover → 本物のホバーが使えるデバイス
           pointer: fine → 高精度ポインター（マウス等）を持つデバイス
           スマホ・タブレットは対象外なのでホバー色変化は起こらない
           ======================================================= */
        @media (hover: hover) and (pointer: fine) {
            button:hover          { background: #222222; } /* 主要ボタンのホバー色 */
            .btn-undone:hover     { background: #e0e0e0; } /* 未完了ボタンのホバー色 */
            .btn-edit:hover       { background: #f5f5f5; } /* 編集ボタンのホバー色 */
            .btn-delete:hover     { background: #f5f5f5; border-color: #555; color: #000; } /* 削除ボタンのホバー色 */
            .cal-nav-btn:hover    { background: #f5f5f5 !important; } /* カレンダーナビボタンのホバー色 */
            .cal-day:hover        { background: #f8f8f8; }  /* カレンダーセルのホバー色 */
            .btn-settings:hover   { background: #222222; }  /* 設定ボタンのホバー色 */
            .btn-method-add:hover { background: #222222; }  /* 追加ボタンのホバー色 */
            .btn-method-delete:hover { background: #f5f5f5; border-color: #111; color: #000; } /* 削除ボタンのホバー色 */
        }

        /* ===================================================================
           タブ切り替えUI（リスト / カレンダー）
           =================================================================== */

        /* タブボタン群のコンテナ */
        .tab-group {
            display: flex;                  /* ボタンを横並びにする */
            border-bottom: 2px solid #e0e0e0; /* 区切り線（アクティブタブの下線で上書きされる） */
            margin-bottom: 16px;            /* タブとコンテンツの間の余白 */
        }

        /* 各タブボタンの基本スタイル */
        .tab-btn {
            flex: 1;                               /* 横幅を等分する */
            padding: 12px 0;                       /* 上下余白でタップしやすくする */
            background: none;                      /* 背景なし */
            color: #9e9e9e;                        /* 非アクティブは薄いグレー */
            border: none;                          /* 枠線なし */
            border-bottom: 3px solid transparent;  /* アクティブ時に上書きする下線用 */
            margin-bottom: -2px;                   /* .tab-groupの区切り線と接続する */
            font-size: 0.95rem;                    /* 文字サイズ */
            font-weight: 600;                      /* セミボールド */
            cursor: pointer;                       /* カーソルをポインターにする */
            touch-action: manipulation;            /* タップ遅延を除去する */
            letter-spacing: 0.01em;                /* 字間を微調整 */
            transition: color 0.15s, border-bottom-color 0.15s; /* 切り替えをなめらかにする */
        }

        /* アクティブなタブボタン（黒で強調） */
        .tab-btn.active {
            color: #000000;                    /* 黒文字で強調する */
            font-weight: 700;                  /* ボールドにする */
            border-bottom: 3px solid #000000; /* 黒下線でアクティブを示す */
        }

        /* ===== リスト見出し行（タイトル＋新規追加ボタン） ===== */
        .list-header {
            display: flex;                   /* タイトルとボタンを横並びにする */
            justify-content: space-between;  /* タイトルを左端、ボタンを右端に配置する */
            align-items: center;             /* 縦方向を中央に揃える */
            margin-bottom: 16px;             /* フィルタ行との間の余白 */
        }

        /* .list-header内の見出しは下マージンを打ち消して行の中央に揃える */
        .list-header h1 { margin: 0; }

        /* 「＋ 新規追加」ボタン（黒背景・白文字で主要アクションを強調） */
        .btn-add {
            padding: 9px 16px;           /* ボタン内側の余白 */
            background: #000000;         /* 黒背景 */
            color: #ffffff;              /* 白文字 */
            border: none;                /* 枠線なし */
            border-radius: 6px;          /* 角を丸くする */
            font-size: 0.9rem;           /* 文字サイズ */
            font-weight: 600;            /* セミボールド */
            cursor: pointer;             /* カーソルをポインターにする */
            touch-action: manipulation;  /* タップ遅延を除去する */
            white-space: nowrap;         /* テキストを折り返さない */
            flex-shrink: 0;              /* 縮まないようにする */
            transition: background 0.15s; /* ホバー変化をなめらかにする */
        }
        .btn-add:hover { background: #222222; } /* ホバー時に少し明るくする */

        /* ===== 絞り込みフィルタ（すべて／未完了／完了） ===== */
        .filter-group {
            display: flex;         /* フィルタボタンを横並びにする */
            gap: 8px;              /* ボタン間の余白 */
            margin-bottom: 16px;   /* リストとの間の余白 */
        }

        /* 各フィルタボタン（ピル型・非選択時はアウトライン） */
        .filter-btn {
            flex: 1;                      /* 横幅を等分する */
            padding: 8px 0;               /* 上下余白でタップしやすくする */
            background: #ffffff;          /* 白背景 */
            color: #555555;               /* ダークグレー文字 */
            border: 1.5px solid #e0e0e0;  /* 薄いグレー枠線 */
            border-radius: 999px;         /* ピル型に丸める */
            font-size: 0.85rem;           /* 文字サイズ */
            font-weight: 600;             /* セミボールド */
            cursor: pointer;              /* カーソルをポインターにする */
            touch-action: manipulation;   /* タップ遅延を除去する */
            transition: background 0.15s, color 0.15s, border-color 0.15s; /* 切り替えをなめらかにする */
        }

        /* 選択中のフィルタボタン（黒背景で強調） */
        .filter-btn.active {
            background: #000000;        /* 黒背景 */
            color: #ffffff;            /* 白文字 */
            border-color: #000000;     /* 枠線も黒にする */
        }

        /* ===== ドラッグ&ドロップ用のつまみ（ハンドル） ===== */
        .drag-handle {
            flex-shrink: 0;              /* 縮まないようにする */
            align-self: center;          /* li内で縦中央に配置する */
            padding: 4px 8px 4px 0;      /* タップしやすいよう余白を確保する */
            margin-right: 2px;           /* 課題情報との間に少し余白を取る */
            color: #cccccc;              /* 薄いグレーで控えめに表示する */
            font-size: 1.1rem;           /* つまみ記号を程よい大きさにする */
            line-height: 1;              /* 行の高さを詰める */
            cursor: grab;                /* つかめることを示すカーソル */
            touch-action: none;          /* タッチ時：ハンドル上ではスクロールせず並び替えを開始する */
            user-select: none;           /* ドラッグ中のテキスト選択を防ぐ */
        }
        .drag-handle:active { cursor: grabbing; } /* ドラッグ中はつかんだカーソルにする */

        /* SortableJSがドラッグ中の要素に付与するクラス（半透明のプレースホルダ表示） */
        .sortable-ghost {
            opacity: 0.4;               /* 移動先の目安として薄く表示する */
            background: #f0f7ff;        /* うっすら青みを付けてドロップ位置を示す */
        }

        /* ===== フォームモーダル（登録・編集） ===== */
        /* 設定モーダルの.settings-modalスタイルを流用しつつ横幅だけ調整する */
        .form-modal { width: 480px; } /* 入力欄が窮屈にならない幅を確保する（max-width:92vwは継承される） */

        /* ===================================================================
           カレンダーボックス
           =================================================================== */

        /* カレンダー全体を囲むカード */
        .calendar-box {
            background: #ffffff;                  /* 白背景 */
            border: 1px solid #e0e0e0;            /* 薄いグレーの枠線 */
            border-radius: 12px;                  /* 角丸 */
            padding: 20px;                        /* 内側の余白 */
            box-shadow: 0 1px 4px rgba(0,0,0,0.06), 0 6px 16px rgba(0,0,0,0.04); /* 立体感のある影 */
        }

        /* カレンダーヘッダー（年月タイトルと前後ボタン） */
        .cal-header {
            display: flex;                  /* 横並びにする */
            justify-content: space-between; /* 両端に配置する */
            align-items: center;            /* 縦方向を中央に揃える */
            margin-bottom: 16px;            /* グリッドとの間の余白 */
        }

        /* 年月タイトル（例：2026年6月） */
        .cal-title {
            font-size: 1.1rem;       /* タイトルサイズ */
            font-weight: 700;        /* ボールド */
            color: #111111;          /* ほぼ黒 */
            letter-spacing: -0.01em; /* 字間を少し詰める */
        }

        /* 前月・翌月ナビゲーションボタン（アウトラインスタイル） */
        .cal-nav-btn {
            padding: 6px 14px;            /* ボタン余白 */
            background: #ffffff;          /* 白背景 */
            color: #000000;               /* 黒文字 */
            border: 1.5px solid #000000;  /* 黒枠線でアウトラインスタイル */
            border-radius: 6px;           /* 角を丸くする */
            font-size: 0.875rem;          /* 文字サイズ */
            font-weight: 600;             /* セミボールド */
            cursor: pointer;              /* カーソルをポインターにする */
            touch-action: manipulation;   /* タップ遅延を除去する */
        }

        /* 曜日ヘッダー行（日〜土） */
        .cal-weekdays {
            display: grid;                          /* グリッドにする */
            grid-template-columns: repeat(7, 1fr);  /* 7等分する */
            margin-bottom: 4px;                     /* グリッドとの間の余白 */
        }

        /* 各曜日ラベル */
        .cal-weekday {
            text-align: center;   /* 中央寄せにする */
            font-size: 0.75rem;   /* 小さめのフォントサイズ */
            font-weight: 700;     /* ボールドにする */
            padding: 6px 0;       /* 上下の余白 */
            color: #555555;       /* ダークグレーの文字色 */
            letter-spacing: 0.02em; /* 字間を微調整 */
        }

        .cal-weekday:first-child { color: #e53935; } /* 日曜ラベルを赤にする（視認性のため維持） */
        .cal-weekday:last-child  { color: #1e88e5; } /* 土曜ラベルを青にする（視認性のため維持） */

        /* カレンダー日付グリッド（6週×7日＝42マス） */
        .cal-grid {
            display: grid;                         /* グリッドにする */
            grid-template-columns: repeat(7, 1fr); /* 7等分する */
            gap: 3px;                              /* セル間の隙間 */
        }

        /* 各日付セル */
        .cal-day {
            min-height: 88px;        /* セルの最小高さ（PC用は余裕を持たせる） */
            border: 1px solid #e0e0e0; /* グレーの枠線 */
            border-radius: 6px;      /* 角を丸くする */
            padding: 4px;            /* セル内側の余白 */
            cursor: pointer;         /* クリック可能と示す */
            overflow: hidden;        /* セルからはみ出た内容を隠す */
            background: #ffffff;     /* 白背景 */
            transition: background 0.1s; /* ホバー変化をなめらかにする */
        }

        /* 前月・翌月の日付セルは薄く表示する */
        .cal-day.other-month {
            background-color: #f8f8f8; /* 薄いグレー背景 */
            opacity: 0.5;              /* 不透明度を下げて目立たなくする */
        }

        /* 今日の日付セルを黒枠線で強調する */
        .cal-day.today { border: 2px solid #000000; }

        /* 日付番号の円形バッジ */
        .cal-day-num {
            font-size: 0.78rem;       /* 小さめのフォントサイズ */
            font-weight: 700;         /* ボールドにする */
            margin-bottom: 3px;       /* タスクチップとの間の余白 */
            width: 22px;              /* 円形にするための固定幅 */
            height: 22px;             /* 円形にするための固定高さ */
            display: flex;            /* テキストを中央配置するためflexにする */
            align-items: center;      /* 縦方向を中央に揃える */
            justify-content: center;  /* 横方向を中央に揃える */
            border-radius: 50%;       /* 円形にする */
            line-height: 1;           /* 行間を詰める */
            color: #333333;           /* 通常の文字色 */
        }

        /* 今日の日付番号を黒い円で強調する */
        .cal-day.today .cal-day-num {
            background-color: #000000; /* 黒い背景の円 */
            color: #ffffff;            /* 白文字 */
        }

        /* 日曜の日付番号を赤にする（今日セルを除外） */
        .cal-day.sunday:not(.today) .cal-day-num { color: #e53935; }

        /* 土曜の日付番号を青にする */
        .cal-day.saturday:not(.today) .cal-day-num { color: #1e88e5; }

        /* 課題チップ（カレンダーセル内のミニラベル） */
        .cal-task {
            font-size: 0.65rem;      /* 小さめのフォントサイズ */
            padding: 2px 5px;        /* チップ内側の余白 */
            border-radius: 3px;      /* 角を丸くする */
            margin-bottom: 2px;      /* チップ間の余白 */
            white-space: nowrap;     /* テキストを折り返さない（PC用） */
            overflow: hidden;        /* はみ出た文字を隠す（PC用） */
            text-overflow: ellipsis; /* はみ出た文字を「...」で省略する（PC用） */
            color: #ffffff;          /* 白文字（科目色の背景に合わせる） */
            display: block;          /* ブロック要素として縦に積む */
            font-weight: 500;        /* ミディアムウェイト */
        }

        .cal-task.done-task { opacity: 0.4; } /* 完了済みは透明度を上げて薄く表示する */

        /* ===================================================================
           カレンダー日付クリックポップアップ
           =================================================================== */

        /* ポップアップ背景オーバーレイ */
        .cal-popup-overlay {
            position: fixed;              /* 画面全体に固定表示する */
            top: 0; left: 0;              /* 左上を起点にする */
            width: 100%; height: 100%;    /* 画面全体を覆う */
            background: rgba(0,0,0,0.4); /* 半透明の黒で背景を暗くする */
            z-index: 100;                 /* ポップアップより下に重ねる */
        }

        /* ポップアップ本体 */
        .cal-popup {
            position: fixed;                   /* 画面に固定表示する */
            top: 50%; left: 50%;               /* 中心点を画面中央に置く */
            transform: translate(-50%, -50%);  /* 自身の半分ずらして完全に中央にする */
            background: #ffffff;               /* 白背景 */
            border: 1px solid #e0e0e0;         /* 薄いグレーの枠線 */
            border-radius: 12px;               /* 角丸 */
            padding: 24px;                     /* 内側の余白 */
            min-width: 300px;                  /* 最小幅を確保する */
            max-width: 90vw;                   /* 画面幅の90%を超えないようにする */
            max-height: 80vh;                  /* 画面高さの80%を超えないようにする */
            overflow-y: auto;                  /* 縦方向にスクロール可能にする */
            z-index: 101;                      /* オーバーレイより上に重ねる */
            box-shadow: 0 4px 32px rgba(0,0,0,0.18); /* 深い影で浮き上がって見せる */
        }

        /* ポップアップヘッダー（日付タイトルと閉じるボタン） */
        .cal-popup-header {
            display: flex;                   /* 横並びにする */
            justify-content: space-between;  /* 両端に配置する */
            align-items: center;             /* 縦方向を中央に揃える */
            margin-bottom: 16px;             /* リストとの間の余白 */
            padding-bottom: 12px;            /* ボーダーとの間に余白 */
            border-bottom: 1px solid #f0f0f0; /* ヘッダーとリストの区切り線 */
            font-size: 1rem;                 /* フォントサイズ */
            font-weight: 700;                /* ボールド */
            color: #111111;                  /* ほぼ黒 */
        }

        /* ポップアップの閉じるボタン */
        .cal-popup-close {
            background: none;           /* 背景なし */
            border: none;               /* 枠線なし */
            font-size: 1.2rem;          /* 文字サイズ */
            cursor: pointer;            /* カーソルをポインターにする */
            color: #9e9e9e;             /* 薄いグレーの文字色 */
            line-height: 1;             /* 行間を詰める */
            touch-action: manipulation; /* タップ遅延を除去する */
            padding: 4px 8px;           /* タップしやすいよう余白を確保する */
            border-radius: 4px;         /* 角を丸くする */
        }

        /* ポップアップのタスクリスト */
        .cal-popup-list {
            list-style: none; /* 黒丸を消す */
            padding: 0;       /* 左インデントをなくす */
            margin: 0;        /* 余白をリセットする */
        }

        /* ポップアップの各タスクアイテム（科目色はJSのinlineスタイルで設定） */
        .cal-popup-list li {
            padding: 12px 14px; /* 内側の余白 */
            border-radius: 8px; /* 角を丸くする */
            margin-bottom: 8px; /* アイテム間の余白 */
            color: #ffffff;     /* 白文字（科目色の背景に合わせる） */
            font-size: 0.88rem; /* フォントサイズ */
            line-height: 1.6;   /* 行間を広くして読みやすくする */
        }

        .cal-popup-list li.done-task { opacity: 0.6; } /* 完了済みは少し薄く表示する */

        /* ポップアップに課題がない場合のメッセージ */
        .cal-popup-empty {
            color: #bdbdbd;      /* 薄いグレー文字 */
            font-style: italic;  /* 斜体にして補足と示す */
            text-align: center;  /* 中央寄せにする */
            padding: 16px 0;     /* 上下の余白 */
            font-size: 0.9rem;   /* フォントサイズ */
        }

        /* ===================================================================
           ③ スマホ向けカレンダー改善
           （セルを大きく・テキストを切らない・多課題日はスクロール可能にする）
           =================================================================== */
        @media (max-width: 600px) {
            /* タブのフォントサイズをスマホ向けに調整する */
            .tab-btn { font-size: 0.85rem; }

            /* カレンダーカードの余白を縮小する */
            .calendar-box { padding: 12px; }

            /* ③ セルをPC(88px)より少し小さくしつつ、上限を設けてスクロール可能にする */
            .cal-day {
                min-height: 72px;  /* 最小高さ：スマホでも十分な表示領域を確保する */
                max-height: 120px; /* 最大高さ：超えたらセル内スクロールで確認できる */
                overflow-y: auto;  /* 課題が多い日はセル内スクロールを有効にする */
                -webkit-overflow-scrolling: touch; /* iOSでのスムーズスクロールを有効にする */
                padding: 3px;      /* 余白を縮小する */
            }

            /* ③ 日付番号のサイズをスマホ向けに調整する */
            .cal-day-num {
                font-size: 0.72rem; /* 小さくする */
                width: 20px;        /* 幅を縮小する */
                height: 20px;       /* 高さを縮小する */
            }

            /* ③ チップのテキストを折り返して全文を表示する（省略しない） */
            .cal-task {
                font-size: 0.6rem;   /* スマホ向けに小さくする */
                padding: 2px 4px;    /* 余白を縮小する */
                white-space: normal; /* 折り返しを許可して課題名が途中で切れないようにする */
                overflow: visible;   /* テキストを隠さない */
                text-overflow: clip; /* 省略記号(...)を無効にする */
                word-break: break-all; /* 長い単語でも折り返す */
                line-height: 1.3;    /* 折り返し時の行間を調整する */
            }
        }

        /* ===================================================================
           設定ボタン（ページ右上）
           =================================================================== */

        /* 設定ボタンを右端に配置するヘッダーエリア */
        .page-header {
            display: flex;             /* フレックスボックスで横並びにする */
            justify-content: flex-end; /* 設定ボタンを右端に寄せる */
            margin-bottom: 14px;       /* フォームカードとの間に余白を取る */
        }

        /* 設定ボタン本体（黒背景・白文字） */
        .btn-settings {
            padding: 8px 18px;           /* ボタン余白 */
            background: #000000;         /* 黒背景 */
            color: #ffffff;              /* 白文字 */
            border: none;                /* 枠線なし */
            border-radius: 6px;          /* 角を丸くする */
            font-size: 0.875rem;         /* 文字サイズ */
            font-weight: 600;            /* セミボールド */
            cursor: pointer;             /* カーソルをポインターにする */
            touch-action: manipulation;  /* タップ遅延を除去する */
            letter-spacing: 0.02em;      /* 字間を微調整 */
        }

        /* ===================================================================
           設定モーダル
           =================================================================== */

        /* 設定モーダルの背景オーバーレイ */
        .settings-overlay {
            position: fixed;              /* 画面全体に固定表示する */
            top: 0; left: 0;              /* 左上を起点にする */
            width: 100%; height: 100%;    /* 画面全体を覆う */
            background: rgba(0,0,0,0.4); /* 半透明の黒 */
            z-index: 200;                 /* カレンダーポップアップ(101)より上に重ねる */
        }

        /* 設定モーダル本体 */
        .settings-modal {
            position: fixed;                   /* 画面に固定表示する */
            top: 50%; left: 50%;               /* 中心点を画面中央に置く */
            transform: translate(-50%, -50%);  /* 自身の半分ずらして完全に中央にする */
            background: #ffffff;               /* 白背景 */
            border: 1px solid #e0e0e0;         /* 薄いグレーの枠線 */
            border-radius: 12px;               /* 角丸 */
            padding: 28px;                     /* 内側の余白 */
            min-width: 320px;                  /* 最小幅を確保する */
            max-width: 92vw;                   /* 画面幅の92%を超えないようにする */
            max-height: 82vh;                  /* 画面高さの82%を超えないようにする */
            overflow-y: auto;                  /* 縦方向にスクロール可能にする */
            z-index: 201;                      /* オーバーレイより上に重ねる */
            box-shadow: 0 4px 32px rgba(0,0,0,0.18); /* 深い影で浮き上がって見せる */
            box-sizing: border-box;            /* paddingを含めて幅を計算する */
        }

        /* 設定モーダルのヘッダー（タイトルと閉じるボタン） */
        .settings-header {
            display: flex;                   /* 横並びにする */
            justify-content: space-between;  /* 両端に配置する */
            align-items: center;             /* 縦方向を中央に揃える */
            margin-bottom: 24px;             /* モーダル内容との間の余白 */
            padding-bottom: 16px;            /* ボーダーとの間に余白 */
            border-bottom: 1px solid #f0f0f0; /* ヘッダーと内容の区切り線 */
            font-size: 1.05rem;              /* フォントサイズ */
            font-weight: 700;                /* ボールド */
            color: #111111;                  /* ほぼ黒 */
        }

        /* 設定モーダルの閉じるボタン */
        .settings-close {
            background: none;           /* 背景なし */
            border: none;               /* 枠線なし */
            font-size: 1.2rem;          /* 文字サイズ */
            cursor: pointer;            /* カーソルをポインターにする */
            color: #9e9e9e;             /* 薄いグレーの文字色 */
            line-height: 1;             /* 行間を詰める */
            touch-action: manipulation; /* タップ遅延を除去する */
            padding: 4px 8px;           /* タップしやすいよう余白を確保する */
            border-radius: 4px;         /* 角を丸くする */
        }

        /* 提出方法リストのセクション見出し */
        .settings-section-title {
            font-size: 0.75rem;       /* 小さめのフォントサイズ */
            font-weight: 700;         /* ボールドにする */
            color: #777777;           /* グレー文字 */
            margin-bottom: 8px;       /* リストとの間の余白 */
            letter-spacing: 0.06em;   /* 字間を広げてキャプション風にする */
            text-transform: uppercase; /* 大文字にしてセクション見出しらしく見せる */
        }

        /* 提出方法のリスト */
        .method-list {
            list-style: none;           /* 黒丸を消す */
            padding: 0;                 /* 左インデントをなくす */
            margin: 0 0 24px 0;         /* 下に余白を取る */
            border: 1px solid #e0e0e0;  /* リスト全体を枠で囲む */
            border-radius: 8px;         /* 角を丸くする */
            overflow: hidden;           /* 角丸を子要素に適用するため */
        }

        /* 提出方法リストの各アイテム */
        .method-list li {
            display: flex;                  /* 横並びにする */
            justify-content: space-between; /* 名前を左端、ボタンを右端に配置する */
            align-items: center;            /* 縦方向を中央に揃える */
            padding: 12px 16px;             /* 内側の余白 */
            border-bottom: 1px solid #f0f0f0; /* 区切り線 */
            font-size: 0.9rem;              /* フォントサイズ */
            color: #111111;                 /* ほぼ黒 */
        }

        .method-list li:last-child { border-bottom: none; }

        /* 提出方法の削除ボタン（アウトラインスタイル） */
        .btn-method-delete {
            padding: 4px 10px;           /* ボタン余白 */
            background: #ffffff;         /* 白背景 */
            color: #555555;              /* ダークグレーの文字色 */
            border: 1.5px solid #e0e0e0; /* 薄いグレーの枠線 */
            border-radius: 4px;          /* 角を丸くする */
            font-size: 0.78rem;          /* 文字サイズ */
            font-weight: 600;            /* セミボールド */
            cursor: pointer;             /* カーソルをポインターにする */
            touch-action: manipulation;  /* タップ遅延を除去する */
            flex-shrink: 0;              /* 縮まないようにする */
            margin-left: 8px;            /* 名前テキストとの間に余白を取る */
        }

        /* 削除ボタン無効状態 */
        .btn-method-delete:disabled {
            opacity: 0.3;    /* 半透明にして使用不可を示す */
            cursor: default; /* ポインターを通常に戻す */
        }

        /* 提出方法の追加エリア（入力欄＋追加ボタン） */
        .method-add-row {
            display: flex; /* 入力欄とボタンを横並びにする */
            gap: 8px;      /* 間に余白を取る */
        }

        /* 追加用テキスト入力欄 */
        .method-add-row input[type="text"] {
            flex: 1;               /* 残りの横幅をすべて使う */
            padding: 10px 12px;    /* 内側の余白 */
            border: 1.5px solid #e0e0e0; /* グレーの枠線 */
            border-radius: 6px;    /* 角を丸くする */
            font-size: 0.95rem;    /* フォントサイズ */
            box-sizing: border-box; /* paddingを含めて幅を計算する */
            min-width: 0;          /* flexアイテムがはみ出さないようにする */
            width: auto;           /* 共通スタイルのwidth:100%をリセットする */
        }

        /* 追加ボタン（黒背景・白文字） */
        .btn-method-add {
            padding: 10px 18px;          /* ボタン余白 */
            background: #000000;         /* 黒背景 */
            color: #ffffff;              /* 白文字 */
            border: none;                /* 枠線なし */
            border-radius: 6px;          /* 角を丸くする */
            font-size: 0.875rem;         /* 文字サイズ */
            font-weight: 600;            /* セミボールド */
            cursor: pointer;             /* カーソルをポインターにする */
            touch-action: manipulation;  /* タップ遅延を除去する */
            flex-shrink: 0;              /* 縮まないようにする */
            white-space: nowrap;         /* テキストを折り返さない */
        }

        /* スマホ向け：設定モーダルの追加エリアを縦並びにする */
        @media (max-width: 400px) {
            .method-add-row {
                flex-direction: column; /* 横並び→縦並びに切り替える */
            }
            .method-add-row input[type="text"],
            .btn-method-add {
                width: 100%; /* 縦並び時は全幅に広げる */
            }
        }
    </style>
</head>
<body>

    <!-- ===== ページ右上：設定ボタン ===== -->
    <div class="page-header"> <!-- 右上エリアのコンテナ（flex で右寄せ） -->
        <button class="btn-settings" onclick="openSettings()">⚙ 設定</button> <!-- 設定モーダルを開くボタン -->
    </div>

    <!-- ===== タブ切り替えボタン ===== -->
    <!-- 【変更】フォームはモーダル化して下部に移動。開いた瞬間に一覧が見える構成にした -->
    <div class="tab-group"> <!-- リストとカレンダーを切り替えるタブのコンテナ -->
        <button class="tab-btn active" id="tabList" onclick="showTab('list')">📋 リスト</button>       <!-- リスト表示タブ（初期表示） -->
        <button class="tab-btn"        id="tabCalendar" onclick="showTab('calendar')">📅 カレンダー</button> <!-- カレンダー表示タブ -->

    <!-- ===== リスト表示エリア（初期表示） ===== -->
    <div id="viewList"> <!-- タブ切り替えでshow/hideするコンテナ -->
        <div class="list-box"> <!-- 課題リストをボックスで囲む -->

            <!-- リスト見出し行：タイトル（左）と新規追加ボタン（右） -->
            <div class="list-header">
                <h1>課題一覧</h1> <!-- 一覧のタイトル -->
                <!-- 「新規追加」ボタン。押すと登録フォームのモーダルが開く -->
                <button class="btn-add" onclick="openTaskForm()">＋ 新規追加</button>
            </div>

            <!-- 【追加】すべて／未完了／完了 の絞り込みフィルタ -->

                <button class="filter-btn"        id="filterActive" onclick="setFilter('active')">未完了</button> <!-- 未完了のみ -->
                <button class="filter-btn"        id="filterDone"   onclick="setFilter('done')">完了</button>     <!-- 完了のみ -->
            </div>

            <ul id="taskList"> <!-- 課題アイテムをここに追加していく（renderTaskList()が中身を生成する） -->
                <!-- 初期表示：まだ課題がない旨を示すメッセージ -->
                <li class="empty-message" id="emptyMessage">まだ課題が登録されていません。</li>
            </ul>
        </div>
    </div>

    <!-- ===== カレンダー表示エリア（初期は非表示） ===== -->
    <div id="viewCalendar" style="display:none;"> <!-- タブ切り替えでshow/hideするコンテナ -->
        <div class="calendar-box"> <!-- カレンダーをボックスで囲む -->

            <!-- カレンダーヘッダー：前月ボタン・年月タイトル・翌月ボタン -->
            <div class="cal-header">
                <button class="cal-nav-btn" onclick="moveMonth(-1)">＜ 前月</button> <!-- 前月へ移動するボタン -->
                <span class="cal-title" id="calTitle"></span>                        <!-- 現在の年月（JSで書き込む） -->
                <button class="cal-nav-btn" onclick="moveMonth(1)">次月 ＞</button>  <!-- 翌月へ移動するボタン -->
            </div>

            <!-- 曜日ヘッダー行（日〜土） -->
            <div class="cal-weekdays">
                <div class="cal-weekday">日</div> <!-- 日曜（赤） -->
                <div class="cal-weekday">月</div> <!-- 月曜 -->
                <div class="cal-weekday">火</div> <!-- 火曜 -->
                <div class="cal-weekday">水</div> <!-- 水曜 -->
                <div class="cal-weekday">木</div> <!-- 木曜 -->
                <div class="cal-weekday">金</div> <!-- 金曜 -->
                <div class="cal-weekday">土</div> <!-- 土曜（青） -->
            </div>

            <!-- カレンダーグリッド（JSで42マスを動的に生成する） -->
            <div class="cal-grid" id="calGrid"></div>

        </div>
    </div>

    <!-- ===== 日付クリックポップアップ ===== -->
    <!-- オーバーレイ（クリックでポップアップを閉じる） -->
    <div class="cal-popup-overlay" id="calPopupOverlay" onclick="closeDayPopup()" style="display:none;"></div>
    <!-- ポップアップ本体 -->
    <div class="cal-popup" id="calPopup" style="display:none;">
        <!-- ヘッダー：日付タイトルと閉じるボタン -->
        <div class="cal-popup-header">
            <span id="calPopupDate"></span> <!-- クリックした日付（JSで書き込む） -->
            <button class="cal-popup-close" onclick="closeDayPopup()">✕</button> <!-- 閉じるボタン -->
        </div>
        <!-- その日の課題リスト（JSで動的に生成する） -->
        <ul class="cal-popup-list" id="calPopupList"></ul>
    </div>

    <!-- ===== 設定モーダル ===== -->
    <!-- オーバーレイ（クリックでモーダルを閉じる） -->
    <div class="settings-overlay" id="settingsOverlay" onclick="closeSettings()" style="display:none;"></div>
    <!-- モーダル本体（オーバーレイのクリックが伝播しないよう onclick で伝播を止める） -->
    <div class="settings-modal" id="settingsModal" onclick="event.stopPropagation()" style="display:none;">

        <!-- モーダルヘッダー：タイトルと閉じるボタン -->
        <div class="settings-header">
            <span>⚙ 提出方法の設定</span> <!-- モーダルのタイトル -->
            <button class="settings-close" onclick="closeSettings()">✕</button> <!-- 閉じるボタン -->
        </div>

        <!-- 提出方法の現在の一覧 -->
        <div class="settings-section-title">現在の提出方法</div> <!-- セクション見出し -->
        <ul class="method-list" id="methodList"> <!-- 提出方法リスト（JSで動的に生成する） -->
        </ul>

        <!-- 新しい提出方法を追加するエリア -->
        <div class="settings-section-title">提出方法を追加</div> <!-- セクション見出し -->
        <div class="method-add-row"> <!-- 入力欄とボタンを横並びにするコンテナ -->
            <input type="text" id="newMethodInput" placeholder="例：Teams提出" maxlength="30"> <!-- 新しい提出方法名を入力する欄 -->
            <button class="btn-method-add" onclick="addMethod()">追加</button> <!-- 入力した提出方法を追加するボタン -->
        </div>

    </div>

    <!-- ===== 課題登録／編集フォーム（モーダル） ===== -->
    <!-- 【変更】上部にあったフォームをモーダル化。「新規追加」ボタンや「編集」ボタンから開く -->
    <!-- オーバーレイ（クリックでモーダルを閉じる） -->
    <div class="settings-overlay" id="formOverlay" onclick="closeTaskForm()" style="display:none;"></div>
    <!-- モーダル本体（オーバーレイのクリックが伝播しないよう onclick で伝播を止める） -->
    <div class="settings-modal form-modal" id="formModal" onclick="event.stopPropagation()" style="display:none;">

        <!-- モーダルヘッダー：タイトルと閉じるボタン -->
        <div class="settings-header">
            <span id="formModalTitle">課題を登録する</span> <!-- 新規は「登録」、編集時は「編集」に切り替わる -->
            <button class="settings-close" onclick="closeTaskForm()">✕</button> <!-- 閉じるボタン -->
        </div>

        <!-- 授業名の入力グループ（任意入力のため必須マークなし） -->
        <div class="form-group">
            <label for="taskSubject">授業名 <span style="font-weight:normal; color:#999; font-size:0.85rem;">（任意）</span></label> <!-- for属性でinputと紐付け、任意であることを明示する -->
            <input type="text" id="taskSubject" placeholder="例：数学・英語など"> <!-- 授業名を入力するテキストボックス（空白でも登録可能） -->
        </div>

        <!-- 課題名の入力グループ -->

            <label for="taskName">課題名</label> <!-- for属性でinputと紐付け -->
            <input type="text" id="taskName" placeholder="例：レポート提出"> <!-- 課題名を入力するテキストボックス -->
        </div>

        <!-- 期限の入力グループ -->
        <!-- datetime-local はiOS Safariで表示不具合があるため
             type="date"（日付）と type="time"（時刻）の2つに分けて代替する -->
        <div class="form-group">
            <label>期限 <span style="font-weight:normal; color:#999; font-size:0.85rem;">（時刻は任意）</span></label> <!-- for属性はinputが2つのため省略する -->
            <div class="deadline-group"> <!-- 日付欄と時刻欄を横並びにするコンテナ（スマホでは縦並び） -->
                <div class="deadline-field"> <!-- ② iOS Safari対応：日付フィールドをラベル付きラッパーで包む -->
                    <input type="date" id="taskDeadlineDate"> <!-- 日付選択ピッカー（iOS/Android/PCで確実に動作する） -->
                    <span class="deadline-sub-label">日付</span> <!-- 入力欄の下に補助ラベルを表示する -->
                </div>
                <div class="deadline-field"> <!-- ② iOS Safari対応：時刻フィールドをラベル付きラッパーで包む -->
                    <input type="time" id="taskDeadlineTime"> <!-- 時刻選択ピッカー（未入力時は00:00として保存する） -->
                    <span class="deadline-sub-label">時刻（任意）</span> <!-- 時刻は省略可能であることを示す補助ラベル -->
                </div>
            </div>
