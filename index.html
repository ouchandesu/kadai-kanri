<!DOCTYPE html> <!-- HTML5文書であることを宣言 -->
<html lang="ja"> <!-- 言語を日本語に設定 -->
<head>
    <meta charset="UTF-8"> <!-- 文字コードをUTF-8に指定（日本語を正しく表示するため） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- スマホでも正しく表示されるよう設定 -->
    <title>課題管理</title> <!-- ブラウザのタブに表示されるタイトル -->
    <style>
        /* ページ全体のフォントとレイアウト設定 */
        body {
            font-family: sans-serif; /* 読みやすいフォントを指定 */
            max-width: 700px;        /* 横幅の最大値を設定して読みやすくする */
            margin: 40px auto;       /* 上下に余白を取り、左右中央に配置 */
            padding: 0 20px;         /* 左右に内側の余白を追加 */
            background-color: #f5f5f5; /* ページ背景を薄いグレーに */
        }

        /* 入力フォーム全体を囲むボックスのスタイル */
        .form-box {
            background: #fff;        /* 背景を白にしてフォームを目立たせる */
            border-radius: 8px;      /* 角を丸くする */
            padding: 24px;           /* ボックス内側の余白 */
            margin-bottom: 32px;     /* ボックスの下に余白 */
            box-shadow: 0 2px 6px rgba(0,0,0,0.1); /* 軽い影を付けて浮いて見せる */
        }

        /* 各入力項目（ラベル＋入力欄）を縦に並べるスタイル */
        .form-group {
            display: flex;           /* フレックスボックスで並べる */
            flex-direction: column;  /* 縦方向に並べる */
            margin-bottom: 16px;     /* 項目間の余白 */
        }

        /* ラベルのスタイル */
        label {
            font-weight: bold;       /* ラベルを太字にして見やすくする */
            margin-bottom: 6px;      /* ラベルと入力欄の間に少し余白 */
            color: #333;             /* 文字色をやや濃いグレーに */
        }

        /* テキスト入力・日付入力・時刻入力・セレクトボックスの共通スタイル
           datetime-local はiOS Safariで正しく動作しないため
           type="date" と type="time" に分割して使う */
        input[type="text"],
        input[type="date"],  /* 日付ピッカー（iOS/Android/PCで確実に動作する） */
        input[type="time"],  /* 時刻ピッカー（iOS/Android/PCで確実に動作する） */
        select {
            padding: 8px 10px;       /* 入力欄の内側の余白 */
            border: 1px solid #ccc;  /* 細いグレーの枠線 */
            border-radius: 4px;      /* 角を少し丸くする */
            font-size: 1rem;         /* 文字サイズを標準に */
            width: 100%;             /* 横幅いっぱいに広げる */
            box-sizing: border-box;  /* paddingを含めて幅を計算 */
        }

        /* 期限フォームの日付欄と時刻欄を横並びにするコンテナ */
        .deadline-group {
            display: flex; /* 日付欄と時刻欄を横並びにする */
            gap: 8px;      /* 入力欄どうしの間に余白を入れる */
        }

        /* .deadline-group内の入力欄はflexで幅を制御するため
           共通スタイルのwidth:100%をwidth:autoで上書きする */
        .deadline-group input {
            width: auto;   /* 共通スタイルのwidth:100%をリセットしてflexに幅を任せる */
            flex: 1;       /* 余白を均等に分け合う（個別のflex値で上書き可能） */
            min-width: 0;  /* flexアイテムがコンテナ幅を超えないようにする */
        }

        /* 日付欄は時刻欄より文字数が多いため広めに確保する（例：2026/05/27 vs 23:59） */
        .deadline-group input[type="date"] {
            flex: 2; /* 日付欄：時刻欄 ＝ 2：1 の比率で横幅を分割する */
        }

        /* 登録ボタン（および更新ボタン）の基本スタイル */
        button {
            padding: 10px 24px;         /* ボタン内側の余白 */
            background-color: #4a90e2;  /* ボタンの背景色（青系） */
            color: #fff;                /* ボタン文字を白に */
            border: none;               /* 枠線をなくす */
            border-radius: 4px;         /* 角を丸くする */
            font-size: 1rem;            /* 文字サイズ */
            cursor: pointer;            /* カーソルをポインターにしてクリック可能と示す */
            touch-action: manipulation; /* タップ時の300ms遅延を除去してタッチ反応を即時にする */
        }

        /* ボタンにマウスを乗せたときの色変化 */
        button:hover {
            background-color: #357abd; /* 少し濃い青に変える */
        }

        /* 課題リストを囲むボックスのスタイル */
        .list-box {
            background: #fff;        /* 背景を白に */
            border-radius: 8px;      /* 角を丸くする */
            padding: 24px;           /* 内側の余白 */
            box-shadow: 0 2px 6px rgba(0,0,0,0.1); /* 軽い影 */
        }

        /* 課題リストの箇条書きスタイル */
        #taskList {
            list-style: none;        /* デフォルトの黒丸を消す */
            padding: 0;              /* 左側のインデントをなくす */
            margin: 0;               /* 余白をリセット */
        }

        /* 各課題アイテムのスタイル */
        #taskList li {
            display: flex;                  /* 課題情報とボタン群を横並びにする */
            justify-content: space-between; /* 情報を左端、ボタンを右端に配置する */
            align-items: flex-start;        /* 縦方向は上揃えにする */
            border-bottom: 1px solid #eee;  /* アイテム下に区切り線 */
            padding: 12px 0;                /* 上下の余白 */
            line-height: 1.6;               /* 行間を広くして読みやすくする */
        }

        /* リストの最後のアイテムは区切り線を表示しない */
        #taskList li:last-child {
            border-bottom: none;
        }

        /* 課題情報（名前・期限・提出方法）をまとめるコンテナ */
        .task-info {
            flex: 1; /* ボタン群以外の横幅をすべて使う */
        }

        /* 編集・削除ボタンをまとめるコンテナ */
        .btn-group {
            display: flex;           /* ボタンを横並びにする */
            flex-direction: row;     /* 横方向に並べる */
            align-items: flex-start; /* 縦方向は上揃えにする */
            flex-shrink: 0;          /* ボタン群が縮まないようにする */
            margin-left: 12px;       /* 課題情報との間に余白を取る */
        }

        /* 編集ボタンのスタイル（オレンジ系で編集操作を連想させる） */
        .btn-edit {
            padding: 6px 14px;           /* ボタン内側の余白 */
            background-color: #f0a500;   /* オレンジ系の背景色で編集を連想させる */
            color: #fff;                 /* ボタン文字を白に */
            border: none;                /* 枠線をなくす */
            border-radius: 4px;          /* 角を丸くする */
            font-size: 0.85rem;          /* やや小さめの文字サイズ */
            cursor: pointer;             /* カーソルをポインターにしてクリック可能と示す */
            margin-right: 6px;           /* 削除ボタンとの間に余白を取る */
        }

        /* 編集ボタンにマウスを乗せたときの色変化 */
        .btn-edit:hover {
            background-color: #c8860a;   /* 少し濃いオレンジに変える */
        }

        /* 削除ボタンのスタイル（赤系カラーで危険操作を示す） */
        .btn-delete {
            padding: 6px 14px;           /* ボタン内側の余白 */
            background-color: #e05555;   /* 赤系の背景色で削除を連想させる */
            color: #fff;                 /* ボタン文字を白に */
            border: none;                /* 枠線をなくす */
            border-radius: 4px;          /* 角を丸くする */
            font-size: 0.85rem;          /* やや小さめの文字サイズ */
            cursor: pointer;             /* カーソルをポインターにしてクリック可能と示す */
        }

        /* 削除ボタンにマウスを乗せたときの色変化 */
        .btn-delete:hover {
            background-color: #c03030;   /* 少し濃い赤に変える */
        }

        /* 完了ボタンのスタイル（緑系で達成感を演出する） */
        .btn-done {
            padding: 6px 14px;           /* ボタン内側の余白 */
            background-color: #4caf50;   /* 緑系の背景色で「完了」を連想させる */
            color: #fff;                 /* ボタン文字を白に */
            border: none;                /* 枠線をなくす */
            border-radius: 4px;          /* 角を丸くする */
            font-size: 0.85rem;          /* やや小さめの文字サイズ */
            cursor: pointer;             /* カーソルをポインターにしてクリック可能と示す */
            margin-right: 6px;           /* 隣のボタンとの間に余白を取る */
            touch-action: manipulation;  /* タップ時の300ms遅延を除去する */
        }

        /* 未完了ボタンのスタイル（グレー系で「元に戻す」ことを示す） */
        .btn-undone {
            padding: 6px 14px;           /* ボタン内側の余白 */
            background-color: #9e9e9e;   /* グレー系の背景色で完了取り消しを示す */
            color: #fff;                 /* ボタン文字を白に */
            border: none;                /* 枠線をなくす */
            border-radius: 4px;          /* 角を丸くする */
            font-size: 0.85rem;          /* やや小さめの文字サイズ */
            cursor: pointer;             /* カーソルをポインターにしてクリック可能と示す */
            margin-right: 6px;           /* 隣のボタンとの間に余白を取る */
            touch-action: manipulation;  /* タップ時の300ms遅延を除去する */
        }

        /* 授業名を小さめに表示するスタイル（課題名の上に置く補足情報） */
        .task-subject {
            font-size: 0.8rem;       /* 課題名より小さいフォントサイズにする */
            color: #888;             /* やや薄いグレーで目立ちすぎないようにする */
            margin-bottom: 2px;      /* 課題名との間に少し余白を入れる */
        }

        /* 課題名を強調表示するスタイル */
        .task-name {
            font-size: 1.1rem;       /* 課題名をやや大きく */
            font-weight: bold;       /* 太字にする */
            color: #222;             /* 濃い文字色 */
        }

        /* 完了済みアイテム全体のスタイル（<li>に付与するクラス） */
        #taskList li.task-completed {
            background-color: #efefef; /* 背景をグレーにして完了済みと一目でわかるようにする */
            border-radius: 4px;        /* 背景色が付いたので角を少し丸くする */
            padding-left: 8px;         /* 背景色の内側に余白を追加する */
            padding-right: 8px;        /* 背景色の内側に余白を追加する */
        }

        /* 完了済みアイテムの課題名に取り消し線を入れて完了感を出す */
        #taskList li.task-completed .task-name {
            text-decoration: line-through; /* 取り消し線を入れる */
            color: #999;                   /* 文字色を薄くして完了済みと区別する */
        }

        /* 期限・提出方法などのサブ情報のスタイル */
        .task-detail {
            font-size: 0.9rem;       /* やや小さめのフォント */
            color: #666;             /* 薄いグレーの文字色 */
            margin-top: 4px;         /* 上に少し余白 */
        }

        /* まだ課題が登録されていない場合のメッセージ */
        .empty-message {
            color: #aaa;             /* 薄いグレー文字 */
            font-style: italic;      /* 斜体にして区別 */
        }

        /* =======================================================
           レスポンシブ対応：画面幅600px以下のスマホ向け調整
           max-width: 600px はほぼすべてのスマートフォンの横幅に該当する
           ======================================================= */
        @media (max-width: 600px) {

            /* 上下余白を縮小してスマホの縦スクロール量を減らす */
            body {
                margin: 16px auto; /* PC(40px)→スマホ(16px)に縮小する */
                padding: 0 12px;   /* 左右余白をPC(20px)→スマホ(12px)に縮小する */
            }

            /* フォームボックスの内側余白を縮小してコンパクトにする */
            .form-box {
                padding: 16px;       /* PC(24px)→スマホ(16px)に縮小する */
                margin-bottom: 16px; /* PC(32px)→スマホ(16px)に縮小する */
            }

            /* 課題一覧ボックスの内側余白も縮小する */
            .list-box {
                padding: 16px; /* PC(24px)→スマホ(16px)に縮小する */
            }

            /* 見出しのフォントサイズを少し小さくしてスマホ幅に収める */
            h1 {
                font-size: 1.4rem; /* PC既定(2rem前後)より小さくして横幅に収める */
            }
            h2 {
                font-size: 1.2rem; /* PC既定(1.5rem前後)より小さくして横幅に収める */
            }

            /* 入力欄のフォントサイズを16px以上にする
               iOSは入力欄のフォントが16px未満だとタップ時に画面を自動ズームするため
               明示的に16pxを指定してズームを防ぐ */
            input[type="text"],
            input[type="date"],  /* 日付入力欄（datetime-localの代替） */
            input[type="time"],  /* 時刻入力欄（datetime-localの代替） */
            select {
                font-size: 16px;    /* iOSの自動ズームを防ぐために必要な最低フォントサイズ */
                padding: 10px 12px; /* タップ時に指が当たりやすいよう縦paddingを拡大する */
            }

            /* スマホでは日付欄と時刻欄を縦並びに切り替えて横幅を最大限活用する */
            .deadline-group {
                flex-direction: column; /* 横並び→縦並びに切り替える */
            }

            /* 縦並び時は各入力欄を横幅いっぱいに広げる */
            .deadline-group input {
                width: 100%; /* 縦並びなので全幅に広げる */
                flex: none;  /* flex比率を無効にしてwidth:100%で幅を決める */
            }

            /* 登録・更新ボタンを横幅いっぱいに広げてどこでもタップしやすくする */
            #submitBtn {
                width: 100%;     /* 横幅をフォームボックス全体に広げる */
                padding: 14px 0; /* 縦paddingを増やして44px以上のタッチ領域を確保する */
            }

            /* 課題アイテムのレイアウトを縦並びに切り替える
               横幅が狭いスマホでも課題情報とボタン群が重ならないようにする */
            #taskList li {
                flex-direction: column;  /* 横並び→縦並び（上：課題情報、下：ボタン群）に切り替える */
                align-items: flex-start; /* 各子要素を左端に揃える */
            }

            /* ボタン群を課題情報の下に移動する（縦並びレイアウト対応） */
            .btn-group {
                margin-left: 0;  /* 縦並び時は左マージン不要なのでリセットする */
                margin-top: 8px; /* 課題情報テキストとの間に余白を入れる */
                width: 100%;     /* 横幅をアイテム全体に広げて編集・削除ボタンを並べる */
            }

            /* 編集ボタンをタッチしやすいサイズに拡大する */
            .btn-edit {
                flex: 1;            /* .btn-group内の横幅を削除ボタンと均等に分ける */
                padding: 11px 0;    /* 縦paddingを増やして44px以上のタッチ領域を確保する */
                text-align: center; /* ボタンのテキストを中央に揃える */
                min-height: 44px;   /* タッチターゲットの最小高さ（Appleガイドライン：44px） */
                font-size: 0.95rem; /* 読みやすいサイズに調整する */
            }

            /* 削除ボタンも同様にタッチしやすいサイズに拡大する */
            .btn-delete {
                flex: 1;            /* .btn-group内の横幅を編集ボタンと均等に分ける */
                padding: 11px 0;    /* 縦paddingを増やして44px以上のタッチ領域を確保する */
                text-align: center; /* ボタンのテキストを中央に揃える */
                min-height: 44px;   /* タッチターゲットの最小高さ（Appleガイドライン：44px） */
                font-size: 0.95rem; /* 読みやすいサイズに調整する */
            }

            /* 完了ボタンもタッチしやすいサイズに拡大する */
            .btn-done {
                flex: 1;            /* .btn-group内の横幅を均等に分ける */
                padding: 11px 0;    /* 縦paddingを増やして44px以上のタッチ領域を確保する */
                text-align: center; /* ボタンのテキストを中央に揃える */
                min-height: 44px;   /* タッチターゲットの最小高さ（Appleガイドライン：44px） */
                font-size: 0.95rem; /* 読みやすいサイズに調整する */
            }

            /* 未完了ボタンも同様にタッチしやすいサイズに拡大する */
            .btn-undone {
                flex: 1;            /* .btn-group内の横幅を均等に分ける */
                padding: 11px 0;    /* 縦paddingを増やして44px以上のタッチ領域を確保する */
                text-align: center; /* ボタンのテキストを中央に揃える */
                min-height: 44px;   /* タッチターゲットの最小高さ（Appleガイドライン：44px） */
                font-size: 0.95rem; /* 読みやすいサイズに調整する */
            }
        }

        /* =======================================================
           ホバー効果をマウスを持つデバイス（PC等）のみに限定する
           hover: hover  → 本物のホバーが使えるデバイス（マウスなど）
           pointer: fine → 高精度ポインター（マウスカーソル等）を持つデバイス
           スマホ・タブレットはこの条件に該当しないためホバー色変化は起こらない
           ======================================================= */
        @media (hover: hover) and (pointer: fine) {
            button:hover {
                background-color: #357abd; /* 登録・更新ボタンのホバー色（少し濃い青） */
            }
            .btn-edit:hover {
                background-color: #c8860a; /* 編集ボタンのホバー色（少し濃いオレンジ） */
            }
            .btn-delete:hover {
                background-color: #c03030; /* 削除ボタンのホバー色（少し濃い赤） */
            }
            .btn-done:hover {
                background-color: #388e3c; /* 完了ボタンのホバー色（少し濃い緑） */
            }
            .btn-undone:hover {
                background-color: #757575; /* 未完了ボタンのホバー色（少し濃いグレー） */
            }
        }
    </style>
</head>
<body>

    <!-- ===== 入力フォームエリア ===== -->
    <div class="form-box"> <!-- フォームをボックスで囲む -->
        <h2>課題を登録する</h2> <!-- フォームのタイトル（編集中は「更新する」に変わる） -->

        <!-- 授業名の入力グループ（任意入力のため必須マークなし） -->
        <div class="form-group">
            <label for="taskSubject">授業名 <span style="font-weight:normal; color:#999; font-size:0.85rem;">（任意）</span></label> <!-- for属性でinputと紐付け、任意であることを明示する -->
            <input type="text" id="taskSubject" placeholder="例：数学・英語など"> <!-- 授業名を入力するテキストボックス（空白でも登録可能） -->
        </div>

        <!-- 課題名の入力グループ -->
        <div class="form-group">
            <label for="taskName">課題名</label> <!-- for属性でinputと紐付け -->
            <input type="text" id="taskName" placeholder="例：レポート提出"> <!-- 課題名を入力するテキストボックス -->
        </div>

        <!-- 期限の入力グループ -->
        <!-- datetime-local はiOS Safariで表示不具合があるため
             type="date"（日付）と type="time"（時刻）の2つに分けて代替する -->
        <div class="form-group">
            <label>期限 <span style="font-weight:normal; color:#999; font-size:0.85rem;">（時刻は任意）</span></label> <!-- for属性はinputが2つのため省略する -->
            <div class="deadline-group"> <!-- 日付欄と時刻欄を横並びにするコンテナ（スマホでは縦並び） -->
                <input type="date" id="taskDeadlineDate"> <!-- 日付選択ピッカー（iOS/Android/PCで確実に動作する） -->
                <input type="time" id="taskDeadlineTime"> <!-- 時刻選択ピッカー（未入力時は00:00として保存する） -->
            </div>
        </div>

        <!-- 提出方法の入力グループ -->
        <div class="form-group">
            <label for="taskMethod">提出方法</label> <!-- 提出方法ラベル -->
            <select id="taskMethod"> <!-- ドロップダウンで選択式にする -->
                <option value="オンライン提出">オンライン提出</option> <!-- 選択肢1 -->
                <option value="印刷して提出">印刷して提出</option>     <!-- 選択肢2 -->
                <option value="メール送付">メール送付</option>         <!-- 選択肢3 -->
                <option value="moodle">moodle</option>                  <!-- 選択肢4 -->
                <option value="ClassRoom">ClassRoom</option>            <!-- 選択肢5 -->
                <option value="その他">その他</option>                   <!-- 選択肢6 -->
            </select>
        </div>

        <!-- 登録ボタン。id付きにしてJSからテキストとonclickを切り替えられるようにする -->
        <button id="submitBtn" onclick="addTask()">登録する</button>
    </div>

    <!-- ===== 課題一覧エリア ===== -->
    <div class="list-box"> <!-- 課題リストをボックスで囲む -->
        <h1>課題一覧</h1> <!-- 一覧のタイトル -->
        <ul id="taskList"> <!-- 課題アイテムをここに追加していく -->
            <!-- 初期表示：まだ課題がない旨を示すメッセージ -->
            <li class="empty-message" id="emptyMessage">まだ課題が登録されていません。</li>
        </ul>
    </div>

    <!-- ===== JavaScript：課題の登録・編集・削除・localStorage保存／読込 ===== -->
    <script>
        // localStorageへの保存に使うキー名を定数として定義（タイポ防止のため1か所にまとめる）
        var STORAGE_KEY = 'kadai_tasks'; // このキー名でブラウザに課題データが保存される

        // 現在編集中の課題ID（nullのときは新規登録モード、IDがセットされているときは編集モード）
        var editingId = null;

        // -----------------------------------------------------------------
        // createTaskElement(task) : 課題オブジェクトを受け取り<li>要素を生成して返す
        // renderTask() と updateTask() の両方から呼ばれる共通ヘルパー関数
        // -----------------------------------------------------------------
        function createTaskElement(task) {
            // 期限の文字列（YYYY-MM-DDTHH:MM）を日付と時刻に分解して日本語形式に変換する
            // 例："2026-05-27T23:59" → "2026年5月27日 23:59"
            var parts     = task.deadline.split('T');    // 'T'を境に日付部分と時刻部分に分割する
            var dateParts = parts[0].split('-');          // 日付部分を'-'で年・月・日に分割する
            var year      = parseInt(dateParts[0], 10);  // 年を整数に変換する
            var month     = parseInt(dateParts[1], 10);  // 月を整数に変換する（1始まりのためそのまま使う）
            var day       = parseInt(dateParts[2], 10);  // 日を整数に変換する

            // 時刻部分がない古いYYYY-MM-DD形式のデータにも対応できるようデフォルト値を用意する
            var hours   = 0;                              // 時のデフォルト値
            var minutes = 0;                              // 分のデフォルト値
            if (parts.length > 1 && parts[1]) {           // 'T'以降の時刻部分が存在する場合のみ処理する
                var timeParts = parts[1].split(':');       // ':'で時と分に分割する（例："23:59" → ["23","59"]）
                hours   = parseInt(timeParts[0], 10);     // 時を整数に変換する
                minutes = parseInt(timeParts[1], 10);     // 分を整数に変換する
            }
            var minStr     = minutes < 10 ? '0' + minutes : String(minutes); // 分を必ず2桁にする（例：9 → "09"）
            var deadlineJP = year + '年' + month + '月' + day + '日 ' + hours + ':' + minStr; // 日本語形式に組み立てる

            var li = document.createElement('li'); // 新しい<li>要素を生成する
            li.dataset.id = task.id;               // 削除・編集時に課題を特定できるよう、IDを<li>のdata属性に紐付ける

            // 授業名が入力されている場合のみ表示するHTML文字列を事前に組み立てる
            // 空文字・未定義の場合は空文字列にして授業名行自体を非表示にする
            var subjectHtml = (task.subject && task.subject !== '')      // 授業名が存在し空でないか確認する
                ? '<div class="task-subject">🏫 ' + escapeHtml(task.subject) + '</div>' // 授業名を表示するHTML（XSS対策でエスケープ）
                : '';                                                                    // 授業名がなければ空文字列にして行を出さない

            // 完了状態（task.done）に応じてボタンのクラスとテキストを切り替える
            // 古いデータで done フィールドが存在しない場合は未完了（false）として扱う
            var isDone    = !!task.done;                               // undefinedや0もfalseに統一する
            var doneClass = isDone ? 'btn-undone' : 'btn-done';       // 完了済みなら「未完了」ボタン、未完了なら「完了」ボタン
            var doneLabel = isDone ? '未完了' : '完了';                 // ボタンに表示するテキスト

            // 完了済みの場合は<li>に task-completed クラスを付与する（CSSで背景色・取り消し線を適用）
            if (isDone) {
                li.classList.add('task-completed'); // グレー背景と取り消し線を有効にする
            }

            // <li>の中身をHTMLで組み立てる
            // 左側：課題情報（授業名・課題名・期限・提出方法）、右側：完了・編集・削除ボタン
            li.innerHTML =
                '<div class="task-info">' +                                                        // 課題情報をまとめるコンテナ開始
                  subjectHtml +                                                                    // 授業名（入力されている場合のみ表示）
                  '<span class="task-name">' + escapeHtml(task.name) + '</span>' +                // 課題名（XSS対策でエスケープ）
                  '<div class="task-detail">📅 期限：' + deadlineJP + '</div>' +                  // 期限を日本語表示
                  '<div class="task-detail">📬 提出方法：' + escapeHtml(task.method) + '</div>' + // 提出方法
                '</div>' +                                                                         // 課題情報コンテナ終了
                '<div class="btn-group">' +                                                        // ボタン群をまとめるコンテナ開始
                  '<button class="' + doneClass + '" onclick="toggleDone(this)">' + doneLabel + '</button>' + // 完了／未完了ボタン（thisでボタン自身を渡す）
                  '<button class="btn-edit" onclick="startEdit(this)">編集</button>' +            // 編集ボタン（thisでボタン自身を渡す）
                  '<button class="btn-delete" onclick="deleteTask(this)">削除</button>' +         // 削除ボタン（thisでボタン自身を渡す）
                '</div>';                                                                          // ボタン群コンテナ終了

            return li; // 生成した<li>要素を返す（追加先は呼び出し元が決める）
        }

        // -----------------------------------------------------------------
        // renderTask(task) : createTaskElement()で生成した<li>をリスト末尾に追加する
        // addTask() と loadTasks() から呼ばれる
        // -----------------------------------------------------------------
        function renderTask(task) {
            var li = createTaskElement(task);                      // 課題の<li>要素を生成する
            document.getElementById('taskList').appendChild(li);   // 課題リストの末尾に<li>を追加する
        }

        // -----------------------------------------------------------------
        // loadTasks() : ページ読み込み時にlocalStorageから保存済み課題を読み込んで表示する
        // -----------------------------------------------------------------
        function loadTasks() {
            var saved = localStorage.getItem(STORAGE_KEY); // localStorageからJSON文字列を取得する
            if (!saved) {  // 保存データがまだ存在しない場合（初回アクセス時など）
                return;    // 何もせずに終了する
            }

            var tasks = JSON.parse(saved); // JSON文字列をJavaScriptの配列に変換する
            if (tasks.length === 0) { // 配列が空（課題が0件）の場合も何もしない
                return;
            }

            // idフィールドを持たない古いデータに対してIDを付与する（過去データとの後方互換性のため）
            var needsResave = false;               // localStorageを保存し直すかどうかのフラグ
            for (var i = 0; i < tasks.length; i++) {
                if (!tasks[i].id) {                        // idが存在しない課題の場合
                    tasks[i].id = String(Date.now() + i);  // インデックスを加算して一意なIDを生成する
                    needsResave = true;                    // 保存し直しが必要と記録する
                }
            }
            if (needsResave) { // IDを付与した課題があった場合はlocalStorageを更新する
                localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
            }

            // 保存データがあるので「まだ登録されていません」メッセージを削除する
            var emptyMsg = document.getElementById('emptyMessage'); // メッセージ要素を取得
            if (emptyMsg) {    // 要素が存在する場合のみ削除（すでに削除済みなら何もしない）
                emptyMsg.remove(); // DOMから要素を取り除く
            }

            // 保存されていたすべての課題をループして1件ずつリストに表示する
            for (var j = 0; j < tasks.length; j++) { // インデックス0から順に末尾まで繰り返す
                renderTask(tasks[j]); // 課題オブジェクトをDOMに描画するヘルパーを呼ぶ
            }
        }

        // -----------------------------------------------------------------
        // addTask() : フォームの入力値を検証し、localStorageへ保存してリストに追加する
        // 「登録する」ボタンがクリックされたときに呼ばれる
        // -----------------------------------------------------------------
        function addTask() {
            // 各入力欄の値を取得し、前後の空白を除去する
            var subject      = document.getElementById('taskSubject').value.trim();  // 授業名（任意のため空白でも可）
            var name         = document.getElementById('taskName').value.trim();     // 課題名
            var deadlineDate = document.getElementById('taskDeadlineDate').value;    // 期限の日付部分（YYYY-MM-DD形式）
            var deadlineTime = document.getElementById('taskDeadlineTime').value;    // 期限の時刻部分（HH:MM形式、未入力可）
            // 日付と時刻を'T'で結合してYYYY-MM-DDTHH:MM形式にまとめる（時刻未入力は00:00で補完）
            var deadline     = deadlineDate + 'T' + (deadlineTime || '00:00');
            var method       = document.getElementById('taskMethod').value;          // 提出方法

            // 課題名が未入力の場合はアラートを出して処理を止める（授業名は任意なのでチェックしない）
            if (name === '') {
                alert('課題名を入力してください。'); // 未入力時の警告メッセージ
                return; // 以降の処理をキャンセルして関数を抜ける
            }

            // 期限の日付が未入力の場合はアラートを出して処理を止める（時刻は任意のため省略可）
            if (deadlineDate === '') {
                alert('期限の日付を選択してください。'); // 未入力時の警告メッセージ
                return; // 以降の処理をキャンセルして関数を抜ける
            }

            // 入力値をひとつの課題オブジェクトにまとめる
            var task = {
                id:       String(Date.now()), // 登録時刻のミリ秒を文字列化した一意なID（削除・編集時の特定に使う）
                subject:  subject,            // 授業名（空文字の場合はそのまま保存する）
                name:     name,               // 課題名
                deadline: deadline,           // 期限（YYYY-MM-DDTHH:MM形式のまま保存）
                method:   method,             // 提出方法
                done:     false               // 完了状態（新規登録時は必ず未完了にする）
            };

            // --- localStorageへの保存処理 ---
            var saved = localStorage.getItem(STORAGE_KEY);           // 既存の保存データを取得する
            var tasks = saved ? JSON.parse(saved) : [];               // データがあれば配列に変換、なければ空配列を用意する
            tasks.push(task);                                         // 新しい課題を配列の末尾に追加する
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); // 配列をJSON文字列に変換してlocalStorageへ書き込む

            // 「まだ登録されていません」メッセージが残っていれば削除する
            var emptyMsg = document.getElementById('emptyMessage'); // メッセージ要素を取得
            if (emptyMsg) {    // 要素が存在する場合のみ処理する
                emptyMsg.remove(); // DOMから要素を取り除く
            }

            renderTask(task); // 追加した課題を画面のリストに即時表示する

            // 登録後、入力欄をリセットして次の入力を準備する
            document.getElementById('taskSubject').value        = '';  // 授業名の入力欄をクリアする
            document.getElementById('taskName').value           = '';  // 課題名の入力欄をクリアする
            document.getElementById('taskDeadlineDate').value   = '';  // 期限の日付入力欄をクリアする
            document.getElementById('taskDeadlineTime').value   = '';  // 期限の時刻入力欄をクリアする
            document.getElementById('taskMethod').selectedIndex = 0;   // 提出方法を先頭の選択肢に戻す
        }

        // -----------------------------------------------------------------
        // startEdit(btn) : 編集ボタンが押されたとき、課題データをフォームに読み込む
        // btn: クリックされた編集ボタン要素（onclick="startEdit(this)"で渡される）
        // -----------------------------------------------------------------
        function startEdit(btn) {
            var li = btn.closest('li');  // ボタンの祖先をたどって親の<li>要素を取得する
            var id = li.dataset.id;      // <li>のdata属性に紐付けたIDを取得する（編集対象を特定するため）

            // localStorageから対象IDに一致する課題オブジェクトを検索する
            var saved = localStorage.getItem(STORAGE_KEY); // 保存データをJSON文字列で取得する
            var tasks = saved ? JSON.parse(saved) : [];    // JSON文字列を配列に変換する
            var task  = null;                              // 見つかった課題を格納する変数
            for (var i = 0; i < tasks.length; i++) {       // 全課題をループして対象を探す
                if (tasks[i].id === id) {                  // IDが一致した課題を見つけたら
                    task = tasks[i];                       // 変数に代入する
                    break;                                 // ループを終了する
                }
            }
            if (!task) { // 課題が見つからなかった場合（通常は起こらない）
                return;  // 何もせずに終了する
            }

            // 保存済みの期限文字列（YYYY-MM-DDTHH:MM）を'T'で分割して日付と時刻を取り出す
            var dlParts  = task.deadline ? task.deadline.split('T') : ['', '']; // 'T'がない場合は空文字を2つ用意する
            var dlDate   = dlParts[0] || ''; // 日付部分（例："2026-05-27"）、存在しない場合は空文字
            var dlTime   = dlParts[1] || ''; // 時刻部分（例："23:59"）、存在しない場合は空文字

            // フォームの各入力欄に課題データを読み込む
            document.getElementById('taskSubject').value      = task.subject || ''; // 授業名をセットする（古いデータにはsubjectがないため||''で補完）
            document.getElementById('taskName').value         = task.name;          // 課題名をセットする
            document.getElementById('taskDeadlineDate').value = dlDate;             // 期限の日付部分をセットする
            document.getElementById('taskDeadlineTime').value = dlTime;             // 期限の時刻部分をセットする
            document.getElementById('taskMethod').value       = task.method;        // 提出方法をセットする

            // 現在編集中の課題IDをグローバル変数に記録する（updateTask()で使う）
            editingId = id;

            // 「登録する」ボタンを「更新する」ボタンに切り替える
            var submitBtn       = document.getElementById('submitBtn'); // ボタン要素を取得する
            submitBtn.textContent = '更新する';                          // ボタンのテキストを変更する
            submitBtn.onclick     = updateTask;                         // クリック時の関数をupdateTaskに切り替える

            // フォームの先頭にスクロールしてカーソルを置く（ユーザーが気づきやすくする）
            document.querySelector('.form-box').scrollIntoView({ behavior: 'smooth' }); // フォームエリアまでスクロールする
            document.getElementById('taskName').focus();                                 // 課題名の入力欄にフォーカスを移す
        }

        // -----------------------------------------------------------------
        // updateTask() : 編集内容でlocalStorageとDOMのリスト表示を更新する
        // 「更新する」ボタンがクリックされたときに呼ばれる
        // -----------------------------------------------------------------
        function updateTask() {
            // 各入力欄の現在値を取得し、前後の空白を除去する
            var subject      = document.getElementById('taskSubject').value.trim();  // 授業名（任意のため空白でも可）
            var name         = document.getElementById('taskName').value.trim();     // 課題名
            var deadlineDate = document.getElementById('taskDeadlineDate').value;    // 期限の日付部分（YYYY-MM-DD形式）
            var deadlineTime = document.getElementById('taskDeadlineTime').value;    // 期限の時刻部分（HH:MM形式、未入力可）
            // 日付と時刻を'T'で結合してYYYY-MM-DDTHH:MM形式にまとめる（時刻未入力は00:00で補完）
            var deadline     = deadlineDate + 'T' + (deadlineTime || '00:00');
            var method       = document.getElementById('taskMethod').value;          // 提出方法

            // 課題名が未入力の場合はアラートを出して処理を止める（授業名は任意なのでチェックしない）
            if (name === '') {
                alert('課題名を入力してください。'); // 未入力時の警告メッセージ
                return; // 以降の処理をキャンセルして関数を抜ける
            }

            // 期限の日付が未入力の場合はアラートを出して処理を止める（時刻は任意のため省略可）
            if (deadlineDate === '') {
                alert('期限の日付を選択してください。'); // 未入力時の警告メッセージ
                return; // 以降の処理をキャンセルして関数を抜ける
            }

            // --- localStorageの更新処理 ---
            var saved = localStorage.getItem(STORAGE_KEY);  // 保存データをJSON文字列で取得する
            var tasks = saved ? JSON.parse(saved) : [];      // JSON文字列を配列に変換する
            for (var i = 0; i < tasks.length; i++) {         // 全課題をループして編集対象を探す
                if (tasks[i].id === editingId) {              // IDが一致した課題を見つけたら
                    tasks[i].subject  = subject;              // 授業名を新しい値で上書きする
                    tasks[i].name     = name;                 // 課題名を新しい値で上書きする
                    tasks[i].deadline = deadline;             // 期限を新しい値で上書きする
                    tasks[i].method   = method;               // 提出方法を新しい値で上書きする
                    break;                                    // 更新完了したのでループを終了する
                }
            }
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); // 更新した配列をlocalStorageへ書き込む

            // --- DOMのリスト表示を更新する処理 ---
            // 対象の<li>要素を検索してselector（data-id属性）で取得する
            var oldLi = document.querySelector('#taskList li[data-id="' + editingId + '"]');
            if (oldLi) { // 対象の<li>が見つかった場合
                // 更新後の課題オブジェクトを使って新しい<li>要素を生成する
                var updatedTask = null;                        // 更新後の課題オブジェクトを格納する変数
                for (var j = 0; j < tasks.length; j++) {      // 全課題をループして更新対象を探す
                    if (tasks[j].id === editingId) {           // IDが一致した課題を見つけたら
                        updatedTask = tasks[j];                // 変数に代入する
                        break;                                 // ループを終了する
                    }
                }
                var newLi = createTaskElement(updatedTask); // 新しい<li>要素を生成する
                oldLi.replaceWith(newLi);                   // 古い<li>をその場で新しい<li>に差し替える（位置は変わらない）
            }

            // フォームの入力欄をリセットして次の新規登録を準備する
            document.getElementById('taskSubject').value        = '';  // 授業名の入力欄をクリアする
            document.getElementById('taskName').value           = '';  // 課題名の入力欄をクリアする
            document.getElementById('taskDeadlineDate').value   = '';  // 期限の日付入力欄をクリアする
            document.getElementById('taskDeadlineTime').value   = '';  // 期限の時刻入力欄をクリアする
            document.getElementById('taskMethod').selectedIndex = 0;   // 提出方法を先頭の選択肢に戻す

            // 「更新する」ボタンを「登録する」ボタンに戻す
            var submitBtn       = document.getElementById('submitBtn'); // ボタン要素を取得する
            submitBtn.textContent = '登録する';                          // ボタンのテキストを元に戻す
            submitBtn.onclick     = addTask;                            // クリック時の関数をaddTaskに戻す

            // 編集モードを終了してグローバル変数をリセットする
            editingId = null; // nullに戻すことで次の操作が新規登録モードになる
        }

        // -----------------------------------------------------------------
        // toggleDone(btn) : 完了／未完了ボタンが押されたとき、完了状態を切り替える
        // btn: クリックされたボタン要素（onclick="toggleDone(this)"で渡される）
        // -----------------------------------------------------------------
        function toggleDone(btn) {
            var li = btn.closest('li'); // ボタンの祖先をたどって親の<li>要素を取得する
            var id = li.dataset.id;     // <li>のdata属性に紐付けたIDを取得する（更新対象を特定するため）

            // localStorageの該当課題の done フィールドを反転する
            var saved = localStorage.getItem(STORAGE_KEY); // 保存データをJSON文字列で取得する
            var tasks = saved ? JSON.parse(saved) : [];    // JSON文字列を配列に変換する
            for (var i = 0; i < tasks.length; i++) {       // 全課題をループして対象を探す
                if (tasks[i].id === id) {                  // IDが一致した課題を見つけたら
                    tasks[i].done = !tasks[i].done;        // trueならfalse、falseならtrueに反転する
                    break;                                 // 更新完了したのでループを終了する
                }
            }
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); // 更新した配列をlocalStorageへ書き込む

            // DOMを更新して見た目に完了状態を反映する
            // classList.toggle()はクラスを追加した場合にtrueを返す（＝完了になった）
            var nowDone = li.classList.toggle('task-completed'); // グレー背景・取り消し線のクラスを切り替える
            if (nowDone) {
                // 未完了→完了 の切り替え
                btn.textContent = '未完了';      // ボタンのテキストを「未完了」に変更する
                btn.className   = 'btn-undone'; // ボタンのクラスをグレー系に切り替える
            } else {
                // 完了→未完了 の切り替え
                btn.textContent = '完了';        // ボタンのテキストを「完了」に戻す
                btn.className   = 'btn-done';   // ボタンのクラスを緑系に戻す
            }
        }

        // -----------------------------------------------------------------
        // deleteTask(btn) : 削除ボタンが押されたとき、課題をDOMとlocalStorageから削除する
        // btn: クリックされた削除ボタン要素（onclick="deleteTask(this)"で渡される）
        // -----------------------------------------------------------------
        function deleteTask(btn) {
            // 削除前に確認ダイアログを表示する
            // confirm()はOKがtrueを、キャンセルがfalseを返す
            if (!confirm('本当に削除しますか？')) { // キャンセルが押された場合
                return; // 何もせずに関数を終了して削除をキャンセルする
            }

            var li = btn.closest('li'); // ボタンの祖先をたどって親の<li>要素を取得する
            var id = li.dataset.id;     // <li>のdata属性に紐付けたIDを取得する（削除対象を特定するため）

            // 削除対象が現在編集中の課題だった場合はフォームと編集状態をリセットする
            if (id === editingId) {                                        // 編集中のIDと一致するか確認する
                document.getElementById('taskSubject').value        = '';     // 授業名の入力欄をクリアする
                document.getElementById('taskName').value           = '';     // 課題名の入力欄をクリアする
                document.getElementById('taskDeadlineDate').value   = '';     // 期限の日付入力欄をクリアする
                document.getElementById('taskDeadlineTime').value   = '';     // 期限の時刻入力欄をクリアする
                document.getElementById('taskMethod').selectedIndex = 0;     // 提出方法を先頭に戻す
                var submitBtn       = document.getElementById('submitBtn'); // ボタン要素を取得する
                submitBtn.textContent = '登録する';                          // ボタンのテキストを元に戻す
                submitBtn.onclick     = addTask;                            // クリック時の関数をaddTaskに戻す
                editingId = null;                                           // 編集モードを終了する
            }

            // localStorageから対象IDに一致する課題を除いた新しい配列を作成する
            var saved    = localStorage.getItem(STORAGE_KEY); // 保存データをJSON文字列で取得する
            var tasks    = saved ? JSON.parse(saved) : [];     // JSON文字列を配列に変換する
            var newTasks = tasks.filter(function (t) {         // filterで条件に合う要素だけ残す
                return t.id !== id;                            // IDが一致しない課題（＝削除対象以外）を残す
            });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(newTasks)); // 更新した配列をlocalStorageへ書き込む

            li.remove(); // DOMから<li>要素を削除して画面上の表示を消す

            // 課題が0件になった場合は「まだ登録されていません」メッセージを再表示する
            var list = document.getElementById('taskList'); // <ul>要素を取得する
            if (list.children.length === 0) {               // 子要素（<li>）がひとつもない場合
                var emptyLi       = document.createElement('li'); // 新しい<li>を生成する
                emptyLi.id        = 'emptyMessage';               // 後で参照できるようIDを付ける
                emptyLi.className = 'empty-message';              // スタイルを適用するクラスを付ける
                emptyLi.textContent = 'まだ課題が登録されていません。'; // 表示するテキストを設定する
                list.appendChild(emptyLi);                        // <ul>にメッセージ<li>を追加する
            }
        }

        // -----------------------------------------------------------------
        // escapeHtml(str) : XSS攻撃を防ぐためHTMLの特殊文字をエスケープする
        // -----------------------------------------------------------------
        function escapeHtml(str) {
            var div = document.createElement('div');       // 一時的なdiv要素を作成する
            div.appendChild(document.createTextNode(str)); // 文字列をテキストノードとして安全に挿入する（自動エスケープされる）
            return div.innerHTML;                          // エスケープ済みのHTML文字列を返す
        }

        // ページのHTMLが読み込まれた直後にloadTasks()を実行する
        // DOMContentLoadedを使うことで、HTML要素が存在する状態で安全に実行できる
        window.addEventListener('DOMContentLoaded', function () {
            loadTasks(); // localStorageから保存済み課題を読み込んで表示する
        });
    </script>

</body>
</html>
