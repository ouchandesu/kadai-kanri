<!DOCTYPE html> <!-- HTML5文書であることを宣言 -->
<html lang="ja"> <!-- 言語を日本語に設定 -->
<head>
    <meta charset="UTF-8"> <!-- 文字コードをUTF-8に指定（日本語を正しく表示するため） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- スマホでも正しく表示されるよう設定 -->
    <title>課題管理</title> <!-- ブラウザのタブに表示されるタイトル -->
    <style>
        /* ページ全体のフォントとレイアウト設定 */
        body {
            font-family: sans-serif; /* 読みやすいフォントを指定 */
            max-width: 700px;        /* 横幅の最大値を設定して読みやすくする */
            margin: 40px auto;       /* 上下に余白を取り、左右中央に配置 */
            padding: 0 20px;         /* 左右に内側の余白を追加 */
            background-color: #f5f5f5; /* ページ背景を薄いグレーに */
        }

        /* 入力フォーム全体を囲むボックスのスタイル */
        .form-box {
            background: #fff;        /* 背景を白にしてフォームを目立たせる */
            border-radius: 8px;      /* 角を丸くする */
            padding: 24px;           /* ボックス内側の余白 */
            margin-bottom: 32px;     /* ボックスの下に余白 */
            box-shadow: 0 2px 6px rgba(0,0,0,0.1); /* 軽い影を付けて浮いて見せる */
        }

        /* 各入力項目（ラベル＋入力欄）を縦に並べるスタイル */
        .form-group {
            display: flex;           /* フレックスボックスで並べる */
            flex-direction: column;  /* 縦方向に並べる */
            margin-bottom: 16px;     /* 項目間の余白 */
        }

        /* ラベルのスタイル */
        label {
            font-weight: bold;       /* ラベルを太字にして見やすくする */
            margin-bottom: 6px;      /* ラベルと入力欄の間に少し余白 */
            color: #333;             /* 文字色をやや濃いグレーに */
        }

        /* テキスト入力・日付入力・時刻入力・セレクトボックスの共通スタイル
           datetime-local はiOS Safariで正しく動作しないため
           type="date" と type="time" に分割して使う */
        input[type="text"],
        input[type="date"],  /* 日付ピッカー（iOS/Android/PCで確実に動作する） */
        input[type="time"],  /* 時刻ピッカー（iOS/Android/PCで確実に動作する） */
        select {
            padding: 8px 10px;       /* 入力欄の内側の余白 */
            border: 1px solid #ccc;  /* 細いグレーの枠線 */
            border-radius: 4px;      /* 角を少し丸くする */
            font-size: 1rem;         /* 文字サイズを標準に */
            width: 100%;             /* 横幅いっぱいに広げる */
            box-sizing: border-box;  /* paddingを含めて幅を計算 */
        }

        /* 期限フォームの日付欄と時刻欄を横並びにするコンテナ */
        .deadline-group {
            display: flex; /* 日付欄と時刻欄を横並びにする */
            gap: 8px;      /* 入力欄どうしの間に余白を入れる */
        }

        /* .deadline-group内の入力欄はflexで幅を制御するため
           共通スタイルのwidth:100%をwidth:autoで上書きする */
        .deadline-group input {
            width: auto;   /* 共通スタイルのwidth:100%をリセットしてflexに幅を任せる */
            flex: 1;       /* 余白を均等に分け合う（個別のflex値で上書き可能） */
            min-width: 0;  /* flexアイテムがコンテナ幅を超えないようにする */
        }

        /* 日付欄は時刻欄より文字数が多いため広めに確保する（例：2026/05/27 vs 23:59） */
        .deadline-group input[type="date"] {
            flex: 2; /* 日付欄：時刻欄 ＝ 2：1 の比率で横幅を分割する */
        }

        /* 登録ボタン（および更新ボタン）の基本スタイル */
        button {
            padding: 10px 24px;         /* ボタン内側の余白 */
            background-color: #4a90e2;  /* ボタンの背景色（青系） */
            color: #fff;                /* ボタン文字を白に */
            border: none;               /* 枠線をなくす */
            border-radius: 4px;         /* 角を丸くする */
            font-size: 1rem;            /* 文字サイズ */
            cursor: pointer;            /* カーソルをポインターにしてクリック可能と示す */
            touch-action: manipulation; /* タップ時の300ms遅延を除去してタッチ反応を即時にする */
        }

        /* ボタンにマウスを乗せたときの色変化 */
        button:hover {
            background-color: #357abd; /* 少し濃い青に変える */
        }

        /* 課題リストを囲むボックスのスタイル */
        .list-box {
            background: #fff;        /* 背景を白に */
            border-radius: 8px;      /* 角を丸くする */
            padding: 24px;           /* 内側の余白 */
            box-shadow: 0 2px 6px rgba(0,0,0,0.1); /* 軽い影 */
        }

        /* 課題リストの箇条書きスタイル */
        #taskList {
            list-style: none;        /* デフォルトの黒丸を消す */
            padding: 0;              /* 左側のインデントをなくす */
            margin: 0;               /* 余白をリセット */
        }

        /* 各課題アイテムのスタイル */
        #taskList li {
            display: flex;                   /* 課題情報とボタン群を横並びにする */
            justify-content: space-between;  /* 情報を左端、ボタンを右端に配置する */
            align-items: flex-start;         /* 縦方向は上揃えにする */
            border-bottom: 1px solid #eee;   /* アイテム下に区切り線 */
            border-left: 4px solid transparent; /* 科目カラーバー領域を確保する（JSで色を設定する） */
            padding: 12px 0;                 /* 上下の余白 */
            line-height: 1.6;                /* 行間を広くして読みやすくする */
        }

        /* ===================================================================
           カウントダウン表示（「あと〇日〇時間」）
           =================================================================== */

        /* カウントダウンテキスト共通スタイル */
        .task-countdown {
            font-size: 0.82rem;  /* やや小さめのフォントサイズにする */
            font-weight: bold;   /* 太字にして目立たせる */
            margin-top: 4px;     /* 期限テキストとの間に余白を取る */
        }

        .countdown-urgent  { color: #e05555; } /* 3日以内：赤字 */
        .countdown-warning { color: #f0a500; } /* 7日以内：オレンジ */
        .countdown-normal  { color: #43a047; } /* それ以外：緑 */
        .countdown-overdue { color: #aaa; }    /* 期限切れ：グレー */

        /* リストの最後のアイテムは区切り線を表示しない */
        #taskList li:last-child {
            border-bottom: none;
        }

        /* 課題情報（名前・期限・提出方法）をまとめるコンテナ */
        .task-info {
            flex: 1; /* ボタン群以外の横幅をすべて使う */
        }

        /* 編集・削除ボタンをまとめるコンテナ */
        .btn-group {
            display: flex;           /* ボタンを横並びにする */
            flex-direction: row;     /* 横方向に並べる */
            align-items: flex-start; /* 縦方向は上揃えにする */
            flex-shrink: 0;          /* ボタン群が縮まないようにする */
            margin-left: 12px;       /* 課題情報との間に余白を取る */
        }

        /* 編集ボタンのスタイル（オレンジ系で編集操作を連想させる） */
        .btn-edit {
            padding: 6px 14px;           /* ボタン内側の余白 */
            background-color: #f0a500;   /* オレンジ系の背景色で編集を連想させる */
            color: #fff;                 /* ボタン文字を白に */
            border: none;                /* 枠線をなくす */
            border-radius: 4px;          /* 角を丸くする */
            font-size: 0.85rem;          /* やや小さめの文字サイズ */
            cursor: pointer;             /* カーソルをポインターにしてクリック可能と示す */
            margin-right: 6px;           /* 削除ボタンとの間に余白を取る */
        }

        /* 編集ボタンにマウスを乗せたときの色変化 */
        .btn-edit:hover {
            background-color: #c8860a;   /* 少し濃いオレンジに変える */
        }

        /* 削除ボタンのスタイル（赤系カラーで危険操作を示す） */
        .btn-delete {
            padding: 6px 14px;           /* ボタン内側の余白 */
            background-color: #e05555;   /* 赤系の背景色で削除を連想させる */
            color: #fff;                 /* ボタン文字を白に */
            border: none;                /* 枠線をなくす */
            border-radius: 4px;          /* 角を丸くする */
            font-size: 0.85rem;          /* やや小さめの文字サイズ */
            cursor: pointer;             /* カーソルをポインターにしてクリック可能と示す */
        }

        /* 削除ボタンにマウスを乗せたときの色変化 */
        .btn-delete:hover {
            background-color: #c03030;   /* 少し濃い赤に変える */
        }

        /* 完了ボタンのスタイル（緑系で達成感を演出する） */
        .btn-done {
            padding: 6px 14px;           /* ボタン内側の余白 */
            background-color: #4caf50;   /* 緑系の背景色で「完了」を連想させる */
            color: #fff;                 /* ボタン文字を白に */
            border: none;                /* 枠線をなくす */
            border-radius: 4px;          /* 角を丸くする */
            font-size: 0.85rem;          /* やや小さめの文字サイズ */
            cursor: pointer;             /* カーソルをポインターにしてクリック可能と示す */
            margin-right: 6px;           /* 隣のボタンとの間に余白を取る */
            touch-action: manipulation;  /* タップ時の300ms遅延を除去する */
        }

        /* 未完了ボタンのスタイル（グレー系で「元に戻す」ことを示す） */
        .btn-undone {
            padding: 6px 14px;           /* ボタン内側の余白 */
            background-color: #9e9e9e;   /* グレー系の背景色で完了取り消しを示す */
            color: #fff;                 /* ボタン文字を白に */
            border: none;                /* 枠線をなくす */
            border-radius: 4px;          /* 角を丸くする */
            font-size: 0.85rem;          /* やや小さめの文字サイズ */
            cursor: pointer;             /* カーソルをポインターにしてクリック可能と示す */
            margin-right: 6px;           /* 隣のボタンとの間に余白を取る */
            touch-action: manipulation;  /* タップ時の300ms遅延を除去する */
        }

        /* 授業名を小さめに表示するスタイル（課題名の上に置く補足情報） */
        .task-subject {
            font-size: 0.8rem;       /* 課題名より小さいフォントサイズにする */
            color: #888;             /* やや薄いグレーで目立ちすぎないようにする */
            margin-bottom: 2px;      /* 課題名との間に少し余白を入れる */
        }

        /* 課題名を強調表示するスタイル */
        .task-name {
            font-size: 1.1rem;       /* 課題名をやや大きく */
            font-weight: bold;       /* 太字にする */
            color: #222;             /* 濃い文字色 */
        }

        /* 完了済みアイテム全体のスタイル（<li>に付与するクラス） */
        #taskList li.task-completed {
            background-color: #efefef; /* 背景をグレーにして完了済みと一目でわかるようにする */
            border-radius: 4px;        /* 背景色が付いたので角を少し丸くする */
            padding-left: 8px;         /* 背景色の内側に余白を追加する */
            padding-right: 8px;        /* 背景色の内側に余白を追加する */
        }

        /* 完了済みアイテムの課題名に取り消し線を入れて完了感を出す */
        #taskList li.task-completed .task-name {
            text-decoration: line-through; /* 取り消し線を入れる */
            color: #999;                   /* 文字色を薄くして完了済みと区別する */
        }

        /* 期限・提出方法などのサブ情報のスタイル */
        .task-detail {
            font-size: 0.9rem;       /* やや小さめのフォント */
            color: #666;             /* 薄いグレーの文字色 */
            margin-top: 4px;         /* 上に少し余白 */
        }

        /* まだ課題が登録されていない場合のメッセージ */
        .empty-message {
            color: #aaa;             /* 薄いグレー文字 */
            font-style: italic;      /* 斜体にして区別 */
        }

        /* =======================================================
           レスポンシブ対応：画面幅600px以下のスマホ向け調整
           max-width: 600px はほぼすべてのスマートフォンの横幅に該当する
           ======================================================= */
        @media (max-width: 600px) {

            /* 上下余白を縮小してスマホの縦スクロール量を減らす */
            body {
                margin: 16px auto; /* PC(40px)→スマホ(16px)に縮小する */
                padding: 0 12px;   /* 左右余白をPC(20px)→スマホ(12px)に縮小する */
            }

            /* フォームボックスの内側余白を縮小してコンパクトにする */
            .form-box {
                padding: 16px;       /* PC(24px)→スマホ(16px)に縮小する */
                margin-bottom: 16px; /* PC(32px)→スマホ(16px)に縮小する */
            }

            /* 課題一覧ボックスの内側余白も縮小する */
            .list-box {
                padding: 16px; /* PC(24px)→スマホ(16px)に縮小する */
            }

            /* 見出しのフォントサイズを少し小さくしてスマホ幅に収める */
            h1 {
                font-size: 1.4rem; /* PC既定(2rem前後)より小さくして横幅に収める */
            }
            h2 {
                font-size: 1.2rem; /* PC既定(1.5rem前後)より小さくして横幅に収める */
            }

            /* 入力欄のフォントサイズを16px以上にする
               iOSは入力欄のフォントが16px未満だとタップ時に画面を自動ズームするため
               明示的に16pxを指定してズームを防ぐ */
            input[type="text"],
            input[type="date"],  /* 日付入力欄（datetime-localの代替） */
            input[type="time"],  /* 時刻入力欄（datetime-localの代替） */
            select {
                font-size: 16px;    /* iOSの自動ズームを防ぐために必要な最低フォントサイズ */
                padding: 10px 12px; /* タップ時に指が当たりやすいよう縦paddingを拡大する */
            }

            /* スマホでは日付欄と時刻欄を縦並びに切り替えて横幅を最大限活用する */
            .deadline-group {
                flex-direction: column; /* 横並び→縦並びに切り替える */
            }

            /* 縦並び時は各入力欄を横幅いっぱいに広げる */
            .deadline-group input {
                width: 100%; /* 縦並びなので全幅に広げる */
                flex: none;  /* flex比率を無効にしてwidth:100%で幅を決める */
            }

            /* 登録・更新ボタンを横幅いっぱいに広げてどこでもタップしやすくする */
            #submitBtn {
                width: 100%;     /* 横幅をフォームボックス全体に広げる */
                padding: 14px 0; /* 縦paddingを増やして44px以上のタッチ領域を確保する */
            }

            /* 課題アイテムのレイアウトを縦並びに切り替える
               横幅が狭いスマホでも課題情報とボタン群が重ならないようにする */
            #taskList li {
                flex-direction: column;  /* 横並び→縦並び（上：課題情報、下：ボタン群）に切り替える */
                align-items: flex-start; /* 各子要素を左端に揃える */
            }

            /* ボタン群を課題情報の下に移動する（縦並びレイアウト対応） */
            .btn-group {
                margin-left: 0;  /* 縦並び時は左マージン不要なのでリセットする */
                margin-top: 8px; /* 課題情報テキストとの間に余白を入れる */
                width: 100%;     /* 横幅をアイテム全体に広げて編集・削除ボタンを並べる */
            }

            /* 編集ボタンをタッチしやすいサイズに拡大する */
            .btn-edit {
                flex: 1;            /* .btn-group内の横幅を削除ボタンと均等に分ける */
                padding: 11px 0;    /* 縦paddingを増やして44px以上のタッチ領域を確保する */
                text-align: center; /* ボタンのテキストを中央に揃える */
                min-height: 44px;   /* タッチターゲットの最小高さ（Appleガイドライン：44px） */
                font-size: 0.95rem; /* 読みやすいサイズに調整する */
            }

            /* 削除ボタンも同様にタッチしやすいサイズに拡大する */
            .btn-delete {
                flex: 1;            /* .btn-group内の横幅を編集ボタンと均等に分ける */
                padding: 11px 0;    /* 縦paddingを増やして44px以上のタッチ領域を確保する */
                text-align: center; /* ボタンのテキストを中央に揃える */
                min-height: 44px;   /* タッチターゲットの最小高さ（Appleガイドライン：44px） */
                font-size: 0.95rem; /* 読みやすいサイズに調整する */
            }

            /* 完了ボタンもタッチしやすいサイズに拡大する */
            .btn-done {
                flex: 1;            /* .btn-group内の横幅を均等に分ける */
                padding: 11px 0;    /* 縦paddingを増やして44px以上のタッチ領域を確保する */
                text-align: center; /* ボタンのテキストを中央に揃える */
                min-height: 44px;   /* タッチターゲットの最小高さ（Appleガイドライン：44px） */
                font-size: 0.95rem; /* 読みやすいサイズに調整する */
            }

            /* 未完了ボタンも同様にタッチしやすいサイズに拡大する */
            .btn-undone {
                flex: 1;            /* .btn-group内の横幅を均等に分ける */
                padding: 11px 0;    /* 縦paddingを増やして44px以上のタッチ領域を確保する */
                text-align: center; /* ボタンのテキストを中央に揃える */
                min-height: 44px;   /* タッチターゲットの最小高さ（Appleガイドライン：44px） */
                font-size: 0.95rem; /* 読みやすいサイズに調整する */
            }
        }

        /* =======================================================
           ホバー効果をマウスを持つデバイス（PC等）のみに限定する
           hover: hover  → 本物のホバーが使えるデバイス（マウスなど）
           pointer: fine → 高精度ポインター（マウスカーソル等）を持つデバイス
           スマホ・タブレットはこの条件に該当しないためホバー色変化は起こらない
           ======================================================= */
        @media (hover: hover) and (pointer: fine) {
            button:hover {
                background-color: #357abd; /* 登録・更新ボタンのホバー色（少し濃い青） */
            }
            .btn-edit:hover {
                background-color: #c8860a; /* 編集ボタンのホバー色（少し濃いオレンジ） */
            }
            .btn-delete:hover {
                background-color: #c03030; /* 削除ボタンのホバー色（少し濃い赤） */
            }
            .btn-done:hover {
                background-color: #388e3c; /* 完了ボタンのホバー色（少し濃い緑） */
            }
            .btn-undone:hover {
                background-color: #757575; /* 未完了ボタンのホバー色（少し濃いグレー） */
            }
            .cal-nav-btn:hover {
                background-color: #357abd; /* 前月・翌月ボタンのホバー色 */
            }
            .cal-day:hover {
                background-color: #f0f4ff; /* 日付セルのホバー背景色（薄い青） */
            }
        }

        /* ===================================================================
           タブ切り替え：リスト表示とカレンダー表示を切り替えるタブUI
           =================================================================== */

        /* タブボタン群のコンテナ */
        .tab-group {
            display: flex;                 /* ボタンを横並びにする */
            border-bottom: 2px solid #ddd; /* タブ下の区切り線（アクティブタブの下線で上書きされる） */
            margin-bottom: 16px;           /* タブとコンテンツの間の余白 */
        }

        /* 各タブボタンの基本スタイル */
        .tab-btn {
            flex: 1;                              /* 横幅を等分する */
            padding: 12px 0;                      /* 上下余白でタップしやすくする */
            background: none;                     /* 背景なし */
            color: #999;                          /* 非アクティブ時の薄い文字色 */
            border: none;                         /* 枠線をなくす */
            border-bottom: 3px solid transparent; /* アクティブ時に色付き下線で上書きする */
            margin-bottom: -2px;                  /* .tab-groupの区切り線に重ねてつなげる */
            font-size: 1rem;                      /* 文字サイズ */
            cursor: pointer;                      /* カーソルをポインターにする */
            touch-action: manipulation;           /* タップ時の300ms遅延を除去する */
            transition: color 0.15s, border-bottom-color 0.15s; /* 色変化をなめらかにする */
        }

        /* アクティブなタブボタン */
        .tab-btn.active {
            color: #4a90e2;                   /* 青い文字色にして強調する */
            font-weight: bold;                /* 太字にする */
            border-bottom: 3px solid #4a90e2; /* 青い下線でアクティブと示す */
        }

        /* ===================================================================
           カレンダーボックス
           =================================================================== */

        /* カレンダー全体を囲むボックス（list-boxと同様のデザイン） */
        .calendar-box {
            background: #fff;                       /* 背景を白に */
            border-radius: 8px;                     /* 角を丸くする */
            padding: 20px;                          /* 内側の余白 */
            box-shadow: 0 2px 6px rgba(0,0,0,0.1); /* 軽い影を付ける */
        }

        /* カレンダーヘッダー（年月表示と前月・翌月ボタンの行） */
        .cal-header {
            display: flex;                   /* 横並びにする */
            justify-content: space-between;  /* 両端に配置する */
            align-items: center;             /* 縦方向を中央に揃える */
            margin-bottom: 16px;             /* カレンダー本体との間の余白 */
        }

        /* 年月タイトル（例：2026年6月） */
        .cal-title {
            font-size: 1.15rem; /* やや大きめのフォントサイズ */
            font-weight: bold;  /* 太字にする */
            color: #333;        /* 文字色 */
        }

        /* 前月・翌月ボタン */
        .cal-nav-btn {
            padding: 6px 16px;           /* ボタン内側の余白 */
            background-color: #4a90e2;   /* 青系の背景色 */
            color: #fff;                 /* 文字を白に */
            border: none;                /* 枠線をなくす */
            border-radius: 4px;          /* 角を丸くする */
            font-size: 1rem;             /* 文字サイズ */
            cursor: pointer;             /* カーソルをポインターにする */
            touch-action: manipulation;  /* タップ遅延を除去する */
        }

        /* 曜日ヘッダー行（日〜土の7列グリッド） */
        .cal-weekdays {
            display: grid;                         /* グリッドにする */
            grid-template-columns: repeat(7, 1fr); /* 7等分する */
            margin-bottom: 4px;                    /* グリッドとの間の余白 */
        }

        /* 各曜日ラベル */
        .cal-weekday {
            text-align: center;  /* 中央寄せにする */
            font-size: 0.8rem;   /* やや小さめのフォントサイズ */
            font-weight: bold;   /* 太字にする */
            padding: 4px 0;      /* 上下の余白 */
            color: #555;         /* 文字色 */
        }

        .cal-weekday:first-child { color: #e05555; } /* 日曜ラベルを赤にする */
        .cal-weekday:last-child  { color: #4a90e2; } /* 土曜ラベルを青にする */

        /* カレンダー日付グリッド（6週×7日＝42マス） */
        .cal-grid {
            display: grid;                         /* グリッドにする */
            grid-template-columns: repeat(7, 1fr); /* 7等分する */
            gap: 2px;                              /* セル間の隙間 */
        }

        /* 各日付セル */
        .cal-day {
            min-height: 80px;        /* セルの最小高さ */
            border: 1px solid #eee;  /* 細いグレーの枠線 */
            border-radius: 4px;      /* 角を少し丸くする */
            padding: 4px;            /* セル内側の余白 */
            cursor: pointer;         /* クリック可能と示す */
            overflow: hidden;        /* セルからはみ出た内容を隠す */
            box-sizing: border-box;  /* paddingを含めて幅を計算する */
        }

        /* 前月・翌月の日付セルは薄く表示する */
        .cal-day.other-month {
            background-color: #f8f8f8; /* 薄いグレー背景 */
            opacity: 0.5;              /* 不透明度を下げて目立たなくする */
        }

        /* 今日の日付セルを枠線で強調する */
        .cal-day.today {
            border: 2px solid #4a90e2; /* 青い枠線で今日を示す */
        }

        /* 日付番号のスタイル */
        .cal-day-num {
            font-size: 0.8rem;        /* やや小さめのフォントサイズ */
            font-weight: bold;        /* 太字にする */
            margin-bottom: 2px;       /* タスクチップとの間の余白 */
            width: 22px;              /* 円形にするための固定幅 */
            height: 22px;             /* 円形にするための固定高さ */
            display: flex;            /* テキストを中央配置するためflexにする */
            align-items: center;      /* 縦方向を中央に揃える */
            justify-content: center;  /* 横方向を中央に揃える */
            border-radius: 50%;       /* 円形にする */
            line-height: 1;           /* 行間を詰める */
            color: #333;              /* 通常の文字色 */
        }

        /* 今日の日付番号を青い円で強調する */
        .cal-day.today .cal-day-num {
            background-color: #4a90e2; /* 青い背景の円 */
            color: #fff;               /* 文字を白に */
        }

        /* 日曜の日付番号を赤にする（today優先のため:not(.today)で除外） */
        .cal-day.sunday:not(.today) .cal-day-num { color: #e05555; }

        /* 土曜の日付番号を青にする */
        .cal-day.saturday:not(.today) .cal-day-num { color: #4a90e2; }

        /* 課題チップ（カレンダーセル内のミニラベル） */
        .cal-task {
            font-size: 0.68rem;      /* 小さめのフォントサイズ */
            padding: 2px 4px;        /* チップ内側の余白 */
            border-radius: 3px;      /* 角を丸くする */
            margin-bottom: 2px;      /* チップ間の余白 */
            white-space: nowrap;     /* テキストを折り返さない */
            overflow: hidden;        /* はみ出た文字を隠す */
            text-overflow: ellipsis; /* はみ出た文字を「...」で省略する */
            color: #fff;             /* 文字を白に */
            display: block;          /* ブロック要素として縦に積む */
        }

        .cal-task.urgent  { background-color: #e05555; } /* 3日以内：赤 */
        .cal-task.warning { background-color: #f0a500; } /* 7日以内：オレンジ */
        .cal-task.normal  { background-color: #4a90e2; } /* それ以外：青 */
        .cal-task.done-task { opacity: 0.4; }             /* 完了済みは薄く表示する */

        /* ===================================================================
           日付クリックポップアップ
           =================================================================== */

        /* 背景を暗くするオーバーレイ */
        .cal-popup-overlay {
            position: fixed;               /* 画面全体に固定表示する */
            top: 0; left: 0;               /* 左上を起点にする */
            width: 100%; height: 100%;     /* 画面全体を覆う */
            background: rgba(0,0,0,0.45); /* 半透明の黒で背景を暗くする */
            z-index: 100;                  /* ポップアップより下に重ねる */
        }

        /* ポップアップ本体 */
        .cal-popup {
            position: fixed;                   /* 画面に固定表示する */
            top: 50%; left: 50%;               /* 中心点を画面中央に置く */
            transform: translate(-50%, -50%);  /* 自身の半分だけずらして完全に中央にする */
            background: #fff;                   /* 背景を白に */
            border-radius: 8px;                 /* 角を丸くする */
            padding: 24px;                      /* 内側の余白 */
            min-width: 280px;                   /* 最小幅を確保する */
            max-width: 90vw;                    /* 画面幅の90%を超えないようにする */
            max-height: 80vh;                   /* 画面高さの80%を超えないようにする */
            overflow-y: auto;                   /* 縦方向にスクロール可能にする */
            z-index: 101;                       /* オーバーレイより上に重ねる */
            box-shadow: 0 4px 20px rgba(0,0,0,0.3); /* 影で浮き上がって見せる */
        }

        /* ポップアップヘッダー（日付タイトルと閉じるボタン） */
        .cal-popup-header {
            display: flex;                   /* 横並びにする */
            justify-content: space-between;  /* 両端に配置する */
            align-items: center;             /* 縦方向を中央に揃える */
            margin-bottom: 16px;             /* リストとの間の余白 */
            font-size: 1.05rem;              /* やや大きめのフォントサイズ */
            font-weight: bold;               /* 太字にする */
            color: #333;                     /* 文字色 */
        }

        /* ポップアップの✕閉じるボタン */
        .cal-popup-close {
            background: none;           /* 背景なし */
            border: none;               /* 枠線なし */
            font-size: 1.3rem;          /* 文字サイズ */
            cursor: pointer;            /* カーソルをポインターにする */
            color: #888;                /* 薄いグレーの文字色 */
            line-height: 1;             /* 行間を詰める */
            touch-action: manipulation; /* タップ遅延を除去する */
            padding: 4px 8px;           /* タップしやすいよう余白を確保する */
        }

        /* ポップアップのタスクリスト */
        .cal-popup-list {
            list-style: none; /* 黒丸を消す */
            padding: 0;       /* 左側インデントをなくす */
            margin: 0;        /* 余白をリセットする */
        }

        /* ポップアップの各タスクアイテム */
        .cal-popup-list li {
            padding: 10px 14px; /* 内側の余白 */
            border-radius: 6px; /* 角を丸くする */
            margin-bottom: 8px; /* アイテム間の余白 */
            color: #fff;        /* 文字を白に */
            font-size: 0.9rem;  /* フォントサイズ */
            line-height: 1.6;   /* 行間を広くして読みやすくする */
        }

        .cal-popup-list li.urgent  { background-color: #e05555; } /* 3日以内：赤 */
        .cal-popup-list li.warning { background-color: #f0a500; } /* 7日以内：オレンジ */
        .cal-popup-list li.normal  { background-color: #4a90e2; } /* それ以外：青 */
        .cal-popup-list li.done-task { opacity: 0.6; }             /* 完了済みは少し薄く表示する */

        /* ポップアップに課題がない場合のメッセージ */
        .cal-popup-empty {
            color: #aaa;         /* 薄いグレー */
            font-style: italic;  /* 斜体にする */
            text-align: center;  /* 中央寄せにする */
            padding: 12px 0;     /* 上下の余白 */
        }

        /* カレンダーのスマホ向け追加調整 */
        @media (max-width: 600px) {
            /* タブのフォントサイズをスマホ向けに調整する */
            .tab-btn {
                font-size: 0.9rem; /* PCより少し小さくする */
            }

            /* カレンダーの内側余白を縮小する */
            .calendar-box {
                padding: 12px; /* PC(20px)より縮小する */
            }

            /* セルの最小高さをスマホ向けに縮小する */
            .cal-day {
                min-height: 52px; /* PC(80px)→スマホ(52px) */
                padding: 2px;     /* 余白も縮小する */
            }

            /* 日付番号を小さくする */
            .cal-day-num {
                font-size: 0.7rem; /* PCより小さくする */
                width: 18px;       /* 幅を縮小する */
                height: 18px;      /* 高さを縮小する */
            }

            /* タスクチップをスマホ向けに縮小する */
            .cal-task {
                font-size: 0.58rem; /* PCより小さくする */
                padding: 1px 2px;   /* 余白を縮小する */
            }
        }

        /* ===================================================================
           設定ボタン（ページ右上）
           =================================================================== */

        /* 設定ボタンを右端に配置するヘッダーエリア */
        .page-header {
            display: flex;           /* フレックスボックスで横並びにする */
            justify-content: flex-end; /* 設定ボタンを右端に寄せる */
            margin-bottom: 12px;     /* 下のフォームボックスとの間に余白を取る */
        }

        /* 設定ボタン本体 */
        .btn-settings {
            padding: 8px 18px;           /* ボタン内側の余白 */
            background-color: #666;      /* グレー系の背景色で機能ボタンと区別する */
            color: #fff;                 /* 文字を白に */
            border: none;                /* 枠線をなくす */
            border-radius: 4px;          /* 角を丸くする */
            font-size: 0.9rem;           /* 文字サイズ */
            cursor: pointer;             /* カーソルをポインターにする */
            touch-action: manipulation;  /* タップ遅延を除去する */
        }

        /* 設定ボタンのホバー色（PCのみ） */
        @media (hover: hover) and (pointer: fine) {
            .btn-settings:hover {
                background-color: #444; /* 少し濃いグレーにする */
            }
        }

        /* ===================================================================
           設定モーダル
           =================================================================== */

        /* 設定モーダルの背景オーバーレイ */
        .settings-overlay {
            position: fixed;               /* 画面全体に固定表示する */
            top: 0; left: 0;               /* 左上を起点にする */
            width: 100%; height: 100%;     /* 画面全体を覆う */
            background: rgba(0,0,0,0.45); /* 半透明の黒で背景を暗くする */
            z-index: 200;                  /* カレンダーポップアップ(101)より上に重ねる */
        }

        /* 設定モーダル本体 */
        .settings-modal {
            position: fixed;                    /* 画面に固定表示する */
            top: 50%; left: 50%;                /* 中心点を画面中央に置く */
            transform: translate(-50%, -50%);   /* 自身の半分だけずらして完全に中央にする */
            background: #fff;                   /* 背景を白に */
            border-radius: 8px;                 /* 角を丸くする */
            padding: 24px;                      /* 内側の余白 */
            min-width: 300px;                   /* 最小幅を確保する */
            max-width: 92vw;                    /* 画面幅の92%を超えないようにする */
            max-height: 80vh;                   /* 画面高さの80%を超えないようにする */
            overflow-y: auto;                   /* 縦方向にスクロール可能にする */
            z-index: 201;                       /* オーバーレイより上に重ねる */
            box-shadow: 0 4px 20px rgba(0,0,0,0.3); /* 影で浮き上がって見せる */
            box-sizing: border-box;             /* paddingを含めて幅を計算する */
        }

        /* 設定モーダルのヘッダー（タイトルと閉じるボタン） */
        .settings-header {
            display: flex;                   /* 横並びにする */
            justify-content: space-between;  /* タイトルを左端、閉じるボタンを右端に配置する */
            align-items: center;             /* 縦方向を中央に揃える */
            margin-bottom: 20px;             /* モーダル内容との間の余白 */
            font-size: 1.1rem;               /* やや大きめのフォントサイズ */
            font-weight: bold;               /* 太字にする */
            color: #333;                     /* 文字色 */
        }

        /* 設定モーダルの✕閉じるボタン */
        .settings-close {
            background: none;           /* 背景なし */
            border: none;               /* 枠線なし */
            font-size: 1.3rem;          /* 文字サイズ */
            cursor: pointer;            /* カーソルをポインターにする */
            color: #888;                /* 薄いグレーの文字色 */
            line-height: 1;             /* 行間を詰める */
            touch-action: manipulation; /* タップ遅延を除去する */
            padding: 4px 8px;           /* タップしやすいよう余白を確保する */
        }

        /* 提出方法リストの見出し */
        .settings-section-title {
            font-size: 0.9rem;       /* やや小さめのフォントサイズ */
            font-weight: bold;       /* 太字にする */
            color: #555;             /* グレー文字 */
            margin-bottom: 8px;      /* リストとの間の余白 */
        }

        /* 提出方法のリスト */
        .method-list {
            list-style: none;      /* 黒丸を消す */
            padding: 0;            /* 左インデントをなくす */
            margin: 0 0 20px 0;    /* 下に余白を取る */
            border: 1px solid #eee; /* リスト全体を枠で囲む */
            border-radius: 6px;    /* 角を丸くする */
        }

        /* 提出方法リストの各アイテム */
        .method-list li {
            display: flex;                   /* 横並びにする */
            justify-content: space-between;  /* 名前を左端、ボタンを右端に配置する */
            align-items: center;             /* 縦方向を中央に揃える */
            padding: 10px 14px;              /* 内側の余白 */
            border-bottom: 1px solid #eee;   /* 区切り線 */
            font-size: 0.95rem;              /* フォントサイズ */
        }

        /* 最後のアイテムの区切り線を消す */
        .method-list li:last-child {
            border-bottom: none;
        }

        /* 提出方法の削除ボタン */
        .btn-method-delete {
            padding: 4px 10px;           /* ボタン内側の余白 */
            background-color: #e05555;   /* 赤系の背景色 */
            color: #fff;                 /* 文字を白に */
            border: none;                /* 枠線なし */
            border-radius: 4px;          /* 角を丸くする */
            font-size: 0.8rem;           /* 文字サイズ */
            cursor: pointer;             /* カーソルをポインターにする */
            touch-action: manipulation;  /* タップ遅延を除去する */
            flex-shrink: 0;              /* 縮まないようにする */
            margin-left: 8px;            /* 名前テキストとの間に余白を取る */
        }

        /* 提出方法が1件だけの場合は削除ボタンを無効化する（無効状態のスタイル） */
        .btn-method-delete:disabled {
            opacity: 0.35;    /* 半透明にして使用不可を示す */
            cursor: default;  /* ポインターを通常に戻す */
        }

        /* 提出方法の追加エリア（入力欄＋追加ボタン） */
        .method-add-row {
            display: flex;  /* 入力欄とボタンを横並びにする */
            gap: 8px;       /* 間に余白を取る */
        }

        /* 追加用テキスト入力欄 */
        .method-add-row input[type="text"] {
            flex: 1;              /* 残りの横幅をすべて使う */
            padding: 8px 10px;    /* 内側の余白 */
            border: 1px solid #ccc; /* 枠線 */
            border-radius: 4px;   /* 角を丸くする */
            font-size: 1rem;      /* フォントサイズ */
            box-sizing: border-box; /* paddingを含めて幅を計算する */
            min-width: 0;         /* flexアイテムがはみ出さないようにする */
            width: auto;          /* 共通スタイルのwidth:100%をリセットする */
        }

        /* 追加ボタン */
        .btn-method-add {
            padding: 8px 16px;           /* ボタン内側の余白 */
            background-color: #4a90e2;   /* 青系の背景色 */
            color: #fff;                 /* 文字を白に */
            border: none;                /* 枠線なし */
            border-radius: 4px;          /* 角を丸くする */
            font-size: 0.9rem;           /* 文字サイズ */
            cursor: pointer;             /* カーソルをポインターにする */
            touch-action: manipulation;  /* タップ遅延を除去する */
            flex-shrink: 0;              /* 縮まないようにする */
            white-space: nowrap;         /* テキストを折り返さない */
        }

        /* スマホ向け：設定モーダルの追加エリアを縦並びにする */
        @media (max-width: 400px) {
            .method-add-row {
                flex-direction: column; /* 横並び→縦並びに切り替える */
            }
            .method-add-row input[type="text"],
            .btn-method-add {
                width: 100%; /* 縦並び時は横幅いっぱいに広げる */
            }
        }
    </style>
</head>
<body>

    <!-- ===== ページ右上：設定ボタン ===== -->
    <div class="page-header"> <!-- 右上エリアのコンテナ（flex で右寄せ） -->
        <button class="btn-settings" onclick="openSettings()">⚙ 設定</button> <!-- 設定モーダルを開くボタン -->
    </div>

    <!-- ===== 入力フォームエリア ===== -->
    <div class="form-box"> <!-- フォームをボックスで囲む -->
        <h2>課題を登録する</h2> <!-- フォームのタイトル（編集中は「更新する」に変わる） -->

        <!-- 授業名の入力グループ（任意入力のため必須マークなし） -->
        <div class="form-group">
            <label for="taskSubject">授業名 <span style="font-weight:normal; color:#999; font-size:0.85rem;">（任意）</span></label> <!-- for属性でinputと紐付け、任意であることを明示する -->
            <input type="text" id="taskSubject" placeholder="例：数学・英語など"> <!-- 授業名を入力するテキストボックス（空白でも登録可能） -->
        </div>

        <!-- 課題名の入力グループ -->
        <div class="form-group">
            <label for="taskName">課題名</label> <!-- for属性でinputと紐付け -->
            <input type="text" id="taskName" placeholder="例：レポート提出"> <!-- 課題名を入力するテキストボックス -->
        </div>

        <!-- 期限の入力グループ -->
        <!-- datetime-local はiOS Safariで表示不具合があるため
             type="date"（日付）と type="time"（時刻）の2つに分けて代替する -->
        <div class="form-group">
            <label>期限 <span style="font-weight:normal; color:#999; font-size:0.85rem;">（時刻は任意）</span></label> <!-- for属性はinputが2つのため省略する -->
            <div class="deadline-group"> <!-- 日付欄と時刻欄を横並びにするコンテナ（スマホでは縦並び） -->
                <input type="date" id="taskDeadlineDate"> <!-- 日付選択ピッカー（iOS/Android/PCで確実に動作する） -->
                <input type="time" id="taskDeadlineTime"> <!-- 時刻選択ピッカー（未入力時は00:00として保存する） -->
            </div>
        </div>

        <!-- 提出方法の入力グループ -->
        <div class="form-group">
            <label for="taskMethod">提出方法</label> <!-- 提出方法ラベル -->
            <select id="taskMethod"> <!-- ドロップダウン。選択肢はloadMethods()がlocalStorageから動的に生成する -->
            </select>
        </div>

        <!-- 登録ボタン。id付きにしてJSからテキストとonclickを切り替えられるようにする -->
        <button id="submitBtn" onclick="addTask()">登録する</button>
    </div>

    <!-- ===== タブ切り替えボタン ===== -->
    <div class="tab-group"> <!-- リストとカレンダーを切り替えるタブのコンテナ -->
        <button class="tab-btn active" id="tabList" onclick="showTab('list')">📋 リスト</button>       <!-- リスト表示タブ（初期表示） -->
        <button class="tab-btn"        id="tabCalendar" onclick="showTab('calendar')">📅 カレンダー</button> <!-- カレンダー表示タブ -->
    </div>

    <!-- ===== リスト表示エリア（初期表示） ===== -->
    <div id="viewList"> <!-- タブ切り替えでshow/hideするコンテナ -->
        <div class="list-box"> <!-- 課題リストをボックスで囲む -->
            <h1>課題一覧</h1> <!-- 一覧のタイトル -->
            <ul id="taskList"> <!-- 課題アイテムをここに追加していく -->
                <!-- 初期表示：まだ課題がない旨を示すメッセージ -->
                <li class="empty-message" id="emptyMessage">まだ課題が登録されていません。</li>
            </ul>
        </div>
    </div>

    <!-- ===== カレンダー表示エリア（初期は非表示） ===== -->
    <div id="viewCalendar" style="display:none;"> <!-- タブ切り替えでshow/hideするコンテナ -->
        <div class="calendar-box"> <!-- カレンダーをボックスで囲む -->

            <!-- カレンダーヘッダー：前月ボタン・年月タイトル・翌月ボタン -->
            <div class="cal-header">
                <button class="cal-nav-btn" onclick="moveMonth(-1)">＜ 前月</button> <!-- 前月へ移動するボタン -->
                <span class="cal-title" id="calTitle"></span>                        <!-- 現在の年月（JSで書き込む） -->
                <button class="cal-nav-btn" onclick="moveMonth(1)">次月 ＞</button>  <!-- 翌月へ移動するボタン -->
            </div>

            <!-- 曜日ヘッダー行（日〜土） -->
            <div class="cal-weekdays">
                <div class="cal-weekday">日</div> <!-- 日曜（赤） -->
                <div class="cal-weekday">月</div> <!-- 月曜 -->
                <div class="cal-weekday">火</div> <!-- 火曜 -->
                <div class="cal-weekday">水</div> <!-- 水曜 -->
                <div class="cal-weekday">木</div> <!-- 木曜 -->
                <div class="cal-weekday">金</div> <!-- 金曜 -->
                <div class="cal-weekday">土</div> <!-- 土曜（青） -->
            </div>

            <!-- カレンダーグリッド（JSで42マスを動的に生成する） -->
            <div class="cal-grid" id="calGrid"></div>

        </div>
    </div>

    <!-- ===== 日付クリックポップアップ ===== -->
    <!-- オーバーレイ（クリックでポップアップを閉じる） -->
    <div class="cal-popup-overlay" id="calPopupOverlay" onclick="closeDayPopup()" style="display:none;"></div>
    <!-- ポップアップ本体 -->
    <div class="cal-popup" id="calPopup" style="display:none;">
        <!-- ヘッダー：日付タイトルと閉じるボタン -->
        <div class="cal-popup-header">
            <span id="calPopupDate"></span> <!-- クリックした日付（JSで書き込む） -->
            <button class="cal-popup-close" onclick="closeDayPopup()">✕</button> <!-- 閉じるボタン -->
        </div>
        <!-- その日の課題リスト（JSで動的に生成する） -->
        <ul class="cal-popup-list" id="calPopupList"></ul>
    </div>

    <!-- ===== 設定モーダル ===== -->
    <!-- オーバーレイ（クリックでモーダルを閉じる） -->
    <div class="settings-overlay" id="settingsOverlay" onclick="closeSettings()" style="display:none;"></div>
    <!-- モーダル本体（オーバーレイのクリックが伝播しないよう onclick で伝播を止める） -->
    <div class="settings-modal" id="settingsModal" onclick="event.stopPropagation()" style="display:none;">

        <!-- モーダルヘッダー：タイトルと閉じるボタン -->
        <div class="settings-header">
            <span>⚙ 提出方法の設定</span> <!-- モーダルのタイトル -->
            <button class="settings-close" onclick="closeSettings()">✕</button> <!-- 閉じるボタン -->
        </div>

        <!-- 提出方法の現在の一覧 -->
        <div class="settings-section-title">現在の提出方法</div> <!-- セクション見出し -->
        <ul class="method-list" id="methodList"> <!-- 提出方法リスト（JSで動的に生成する） -->
        </ul>

        <!-- 新しい提出方法を追加するエリア -->
        <div class="settings-section-title">提出方法を追加</div> <!-- セクション見出し -->
        <div class="method-add-row"> <!-- 入力欄とボタンを横並びにするコンテナ -->
            <input type="text" id="newMethodInput" placeholder="例：Teams提出" maxlength="30"> <!-- 新しい提出方法名を入力する欄 -->
            <button class="btn-method-add" onclick="addMethod()">追加</button> <!-- 入力した提出方法を追加するボタン -->
        </div>

    </div>

    <!-- ===== JavaScript：課題の登録・編集・削除・localStorage保存／読込 ===== -->
    <script>
        // localStorageへの保存に使うキー名を定数として定義（タイポ防止のため1か所にまとめる）
        var STORAGE_KEY = 'kadai_tasks';   // このキー名でブラウザに課題データが保存される
        var METHODS_KEY = 'kadai_methods'; // 提出方法リストを保存するキー名

        // 提出方法のデフォルト値（localStorageに保存データがない初回起動時に使う）
        var DEFAULT_METHODS = ['オンライン提出', '印刷して提出', 'メール送付', 'その他'];

        // 科目カラーバーに使う色のパレット（白文字が映える彩度・明度のMaterial Design準拠色）
        // ハッシュで授業名をこの配列の1色に決定論的にマッピングする
        var SUBJECT_COLORS = [
            '#e53935', // 赤
            '#d81b60', // ピンク
            '#8e24aa', // 紫
            '#1e88e5', // 青
            '#00897b', // ティール
            '#43a047', // 緑
            '#fb8c00', // オレンジ
            '#6d4c41', // ブラウン
        ];

        // 現在編集中の課題ID（nullのときは新規登録モード、IDがセットされているときは編集モード）
        var editingId = null;

        // カレンダーが現在表示している年と月（0始まり）を管理する変数
        var calYear  = new Date().getFullYear(); // 初期値：現在の年
        var calMonth = new Date().getMonth();    // 初期値：現在の月（0=1月、11=12月）

        // -----------------------------------------------------------------
        // showTab(tabName) : タブを切り替えてリストまたはカレンダーを表示する
        // tabName: 'list' または 'calendar'
        // -----------------------------------------------------------------
        function showTab(tabName) {
            var isCalendar = tabName === 'calendar'; // カレンダータブが選ばれたかを判定する

            // リストとカレンダーのビューを表示・非表示に切り替える
            document.getElementById('viewList').style.display     = isCalendar ? 'none'  : 'block'; // リスト：カレンダー時は非表示
            document.getElementById('viewCalendar').style.display = isCalendar ? 'block' : 'none';  // カレンダー：選択時のみ表示

            // タブボタンのactiveクラスを切り替える
            document.getElementById('tabList').classList.toggle('active',     !isCalendar); // リストタブ
            document.getElementById('tabCalendar').classList.toggle('active', isCalendar);  // カレンダータブ

            // カレンダーに切り替えた場合はその場で描画する
            if (isCalendar) {
                renderCalendar(); // 最新のlocalStorageデータでカレンダーを描画する
            }
        }

        // -----------------------------------------------------------------
        // moveMonth(delta) : カレンダーの表示月を移動する
        // delta: +1で翌月、-1で前月
        // -----------------------------------------------------------------
        function moveMonth(delta) {
            calMonth += delta;         // 月をdeltaだけ増減する
            if (calMonth < 0) {        // 1月（0）より前になった場合
                calMonth = 11;         // 12月（11）に戻す
                calYear--;             // 年を1つ減らす
            }
            if (calMonth > 11) {       // 12月（11）より後になった場合
                calMonth = 0;          // 1月（0）に戻す
                calYear++;             // 年を1つ増やす
            }
            renderCalendar();          // 移動後の月のカレンダーを再描画する
        }

        // -----------------------------------------------------------------
        // getUrgencyClass(deadlineStr) : 締め切りまでの残り日数から緊急度クラスを返す
        // deadlineStr: 'YYYY-MM-DDTHH:MM' 形式の文字列
        // 返り値: 'urgent'（3日以内・赤）/ 'warning'（7日以内・オレンジ）/ 'normal'（青）
        // -----------------------------------------------------------------
        function getUrgencyClass(deadlineStr) {
            var today    = new Date();                  // 現在の日時を取得する
            today.setHours(0, 0, 0, 0);                 // 時刻を0時0分0秒にして日付のみで比較する
            var deadline = new Date(deadlineStr);       // 締め切り文字列をDateオブジェクトに変換する
            var diffMs   = deadline - today;            // 締め切りまでのミリ秒差を計算する
            var diffDays = Math.ceil(diffMs / (1000 * 60 * 60 * 24)); // ミリ秒を日数に変換する（切り上げ）
            if (diffDays <= 3) return 'urgent';         // 3日以内（過去分含む）は赤
            if (diffDays <= 7) return 'warning';        // 7日以内はオレンジ
            return 'normal';                            // それ以外は青
        }

        // -----------------------------------------------------------------
        // renderCalendar() : calYear / calMonth の月カレンダーを描画する
        // -----------------------------------------------------------------
        function renderCalendar() {
            // 年月タイトルを更新する（例：「2026年6月」）
            document.getElementById('calTitle').textContent =
                calYear + '年' + (calMonth + 1) + '月'; // calMonthは0始まりなので+1して表示する

            // localStorageから課題データを読み込む
            var saved = localStorage.getItem(STORAGE_KEY);  // 保存データをJSON文字列で取得する
            var tasks = saved ? JSON.parse(saved) : [];      // JSON文字列を配列に変換する

            // 課題を締め切り日付（YYYY-MM-DD）ごとにまとめたマップを作る
            // キー: 'YYYY-MM-DD', 値: その日の課題オブジェクトの配列
            var taskMap = {};                                      // マップを空で初期化する
            for (var i = 0; i < tasks.length; i++) {               // 全課題をループする
                var dateKey = tasks[i].deadline.split('T')[0];     // 'T'の前の日付部分だけ取り出す
                if (!taskMap[dateKey]) { taskMap[dateKey] = []; }  // 初めての日付は空配列を作る
                taskMap[dateKey].push(tasks[i]);                   // その日の配列に課題を追加する
            }

            // カレンダーグリッドの開始日を計算する（表示月1日の属する週の日曜日）
            var firstDay  = new Date(calYear, calMonth, 1);     // 表示月の1日を取得する
            var startDate = new Date(firstDay);                 // コピーを作って変更する
            startDate.setDate(1 - firstDay.getDay());           // 1日の曜日（0=日）分だけ引いて日曜始まりにする

            // 今日の日付（セルの「今日」判定に使う）
            var today = new Date();      // 現在の日時を取得する
            today.setHours(0, 0, 0, 0); // 時刻をリセットして日付のみで比較する

            // グリッドをクリアして再描画する
            var grid = document.getElementById('calGrid'); // グリッド要素を取得する
            grid.innerHTML = '';                           // 既存の描画をすべて消去する

            // 42マス（6週×7日）分のセルを生成する
            for (var d = 0; d < 42; d++) {                      // 0〜41のインデックスでループする
                var cellDate  = new Date(startDate);             // 開始日のコピーを作る
                cellDate.setDate(startDate.getDate() + d);       // d日後の日付を計算する

                var cellYear  = cellDate.getFullYear(); // セルの年を取得する
                var cellMonth = cellDate.getMonth();    // セルの月を取得する（0始まり）
                var cellDay   = cellDate.getDate();     // セルの日を取得する

                // 日付キーを 'YYYY-MM-DD' 形式で組み立てる（localStorageの形式に合わせる）
                var mm      = (cellMonth + 1) < 10 ? '0' + (cellMonth + 1) : String(cellMonth + 1); // 月を2桁にする
                var dd      = cellDay < 10           ? '0' + cellDay        : String(cellDay);       // 日を2桁にする
                var dateKey = cellYear + '-' + mm + '-' + dd;  // 'YYYY-MM-DD' 形式のキーを作る

                // セルとなる<div>要素を作成する
                var cell = document.createElement('div'); // 新しいdiv要素を生成する
                cell.className   = 'cal-day';             // 基本クラスを付ける
                cell.dataset.date = dateKey;              // クリック時に日付を取得できるようdata属性に保存する

                // 表示月以外（前月・翌月）のセルに other-month クラスを付ける
                if (cellMonth !== calMonth) {
                    cell.classList.add('other-month'); // 薄い表示にするクラスを付ける
                }

                // 今日のセルに today クラスを付ける
                if (cellDate.getTime() === today.getTime()) {
                    cell.classList.add('today'); // 青枠で強調するクラスを付ける
                }

                // 曜日に応じてクラスを付けて色分けする
                var dow = cellDate.getDay(); // 0=日曜、6=土曜
                if (dow === 0) cell.classList.add('sunday');   // 日曜：日付番号を赤にする
                if (dow === 6) cell.classList.add('saturday'); // 土曜：日付番号を青にする

                // セルをクリックしたときポップアップを表示するイベントを登録する
                // クロージャを使ってループ内の dateKey を正しく捕捉する
                cell.addEventListener('click', (function(dk) {
                    return function() { showDayPopup(dk); }; // クリック時にその日のdateKeyを渡す
                })(dateKey));

                // 日付番号の<div>を生成してセルに追加する
                var numDiv = document.createElement('div'); // 日付番号用のdivを生成する
                numDiv.className   = 'cal-day-num';         // スタイル用クラスを付ける
                numDiv.textContent = cellDay;               // 日付数字を表示する
                cell.appendChild(numDiv);                   // セルに日付番号を追加する

                // この日の課題チップを生成してセルに追加する
                var dayTasks = taskMap[dateKey] || []; // この日の課題リスト（なければ空配列）
                for (var t = 0; t < dayTasks.length; t++) {                          // この日の全課題をループする
                    var chip = document.createElement('div');                         // チップ用のdivを生成する
                    chip.className            = 'cal-task' +                          // 基本クラスを付ける
                        (dayTasks[t].done ? ' done-task' : '');                      // 完了済みはさらに薄くする
                    chip.style.backgroundColor = getSubjectColor(dayTasks[t].subject); // 授業名の色をチップ背景色に設定する
                    chip.textContent = dayTasks[t].name;                             // 課題名をテキストとして表示する
                    chip.title       = dayTasks[t].name;                             // ホバー時に全文をツールチップ表示する
                    cell.appendChild(chip);                                           // セルにチップを追加する
                }

                grid.appendChild(cell); // 完成したセルをグリッドに追加する
            }
        }

        // -----------------------------------------------------------------
        // showDayPopup(dateStr) : 日付セルがクリックされたとき、その日の課題一覧をポップアップ表示する
        // dateStr: 'YYYY-MM-DD' 形式の文字列
        // -----------------------------------------------------------------
        function showDayPopup(dateStr) {
            // localStorageから課題データを読み込む
            var saved = localStorage.getItem(STORAGE_KEY);  // 保存データをJSON文字列で取得する
            var tasks = saved ? JSON.parse(saved) : [];      // JSON文字列を配列に変換する

            // クリックした日付の課題だけを抽出する
            var dayTasks = tasks.filter(function(t) {
                return t.deadline.split('T')[0] === dateStr; // 日付部分が一致する課題を残す
            });

            // ポップアップの日付タイトルを日本語形式で表示する（例：「2026年6月15日の課題」）
            var parts = dateStr.split('-');           // '-'で年月日に分割する
            var py = parseInt(parts[0], 10);          // 年を整数に変換する
            var pm = parseInt(parts[1], 10);          // 月を整数に変換する
            var pd = parseInt(parts[2], 10);          // 日を整数に変換する
            document.getElementById('calPopupDate').textContent =
                py + '年' + pm + '月' + pd + '日の課題'; // 日本語形式に組み立てる

            // ポップアップのリストを生成する
            var list = document.getElementById('calPopupList'); // リスト要素を取得する
            list.innerHTML = '';                                 // 既存の内容をクリアする

            if (dayTasks.length === 0) {
                // この日に課題がない場合はメッセージを表示する
                var emptyP = document.createElement('p'); // メッセージ用の<p>要素を生成する
                emptyP.className   = 'cal-popup-empty';   // スタイルクラスを付ける
                emptyP.textContent = 'この日の課題はありません。'; // テキストを設定する
                list.appendChild(emptyP);                 // リストに追加する
            } else {
                // この日の課題を1件ずつリストに追加する
                for (var i = 0; i < dayTasks.length; i++) {
                    var li = document.createElement('li');                                          // リストアイテムを生成する
                    li.className = (dayTasks[i].done ? 'done-task' : '');                          // 完了状態のみクラスで管理する
                    li.style.backgroundColor = getSubjectColor(dayTasks[i].subject);               // 授業名の色をアイテム背景色に設定する

                    // 授業名・課題名・カウントダウン・時刻・提出方法・完了状態を組み立てる
                    var subjectStr = dayTasks[i].subject ? '🏫 ' + escapeHtml(dayTasks[i].subject) + '<br>' : ''; // 授業名（任意）
                    var timeStr    = dayTasks[i].deadline.split('T')[1] || '00:00';                               // 時刻部分（なければ00:00）
                    var doneStr    = dayTasks[i].done ? '　✅ 完了' : '';                                         // 完了状態の表示
                    var cdText     = getCountdownText(dayTasks[i].deadline);                                      // カウントダウンテキストを生成する
                    li.innerHTML   =
                        subjectStr +                                                                              // 授業名行（あれば）
                        '<strong>' + escapeHtml(dayTasks[i].name) + '</strong>' + doneStr + '<br>' +            // 課題名と完了マーク
                        '<small>⏳ ' + cdText + '　⏰ ' + timeStr + '　📬 ' + escapeHtml(dayTasks[i].method) + '</small>'; // カウントダウン・時刻・提出方法

                    list.appendChild(li); // リストにアイテムを追加する
                }
            }

            // オーバーレイとポップアップを表示する
            document.getElementById('calPopupOverlay').style.display = 'block'; // 背景を暗くするオーバーレイを表示する
            document.getElementById('calPopup').style.display        = 'block'; // ポップアップ本体を表示する
        }

        // -----------------------------------------------------------------
        // closeDayPopup() : ポップアップとオーバーレイを非表示にする
        // -----------------------------------------------------------------
        function closeDayPopup() {
            document.getElementById('calPopupOverlay').style.display = 'none'; // オーバーレイを非表示にする
            document.getElementById('calPopup').style.display        = 'none'; // ポップアップを非表示にする
        }

        // -----------------------------------------------------------------
        // refreshCalendarIfVisible() : カレンダービューが表示中の場合だけ再描画する
        // addTask / updateTask / deleteTask / toggleDone から呼ばれる
        // -----------------------------------------------------------------
        function refreshCalendarIfVisible() {
            // カレンダービューが現在表示されているか確認する
            if (document.getElementById('viewCalendar').style.display !== 'none') {
                renderCalendar(); // 表示中なら最新データで再描画する
            }
        }

        // -----------------------------------------------------------------
        // createTaskElement(task) : 課題オブジェクトを受け取り<li>要素を生成して返す
        // renderTask() と updateTask() の両方から呼ばれる共通ヘルパー関数
        // -----------------------------------------------------------------
        function createTaskElement(task) {
            // 期限の文字列（YYYY-MM-DDTHH:MM）を日付と時刻に分解して日本語形式に変換する
            // 例："2026-05-27T23:59" → "2026年5月27日 23:59"
            var parts     = task.deadline.split('T');    // 'T'を境に日付部分と時刻部分に分割する
            var dateParts = parts[0].split('-');          // 日付部分を'-'で年・月・日に分割する
            var year      = parseInt(dateParts[0], 10);  // 年を整数に変換する
            var month     = parseInt(dateParts[1], 10);  // 月を整数に変換する（1始まりのためそのまま使う）
            var day       = parseInt(dateParts[2], 10);  // 日を整数に変換する

            // 時刻部分がない古いYYYY-MM-DD形式のデータにも対応できるようデフォルト値を用意する
            var hours   = 0;                              // 時のデフォルト値
            var minutes = 0;                              // 分のデフォルト値
            if (parts.length > 1 && parts[1]) {           // 'T'以降の時刻部分が存在する場合のみ処理する
                var timeParts = parts[1].split(':');       // ':'で時と分に分割する（例："23:59" → ["23","59"]）
                hours   = parseInt(timeParts[0], 10);     // 時を整数に変換する
                minutes = parseInt(timeParts[1], 10);     // 分を整数に変換する
            }
            var minStr     = minutes < 10 ? '0' + minutes : String(minutes); // 分を必ず2桁にする（例：9 → "09"）
            var deadlineJP = year + '年' + month + '月' + day + '日 ' + hours + ':' + minStr; // 日本語形式に組み立てる

            var li = document.createElement('li'); // 新しい<li>要素を生成する
            li.dataset.id = task.id;               // 削除・編集時に課題を特定できるよう、IDを<li>のdata属性に紐付ける

            // 授業名に対応する科目色を取得する（授業名なし→グレー、授業名あり→パレットから決定論的に選択）
            var subjectColor = getSubjectColor(task.subject); // 授業名ごとの一意な色を取得する

            // 左ボーダーに科目色を設定してカラーバーを表示する
            li.style.borderLeftColor = subjectColor; // CSS で確保した border-left の色を科目色で上書きする
            li.style.paddingLeft     = '10px';       // ボーダーとコンテンツの間に余白を追加する

            // 授業名が入力されている場合のみ表示するHTML文字列を事前に組み立てる
            // 科目色をインラインスタイルで適用し、授業名がなければ行ごと省略する
            var subjectHtml = (task.subject && task.subject !== '')    // 授業名が存在し空でないか確認する
                ? '<div class="task-subject" style="color:' + subjectColor + '">🏫 ' + escapeHtml(task.subject) + '</div>'
                : '';                                                  // 授業名がなければ空文字列にして行を出さない

            // カウントダウンのテキストと緊急度クラスを事前に生成する
            var cdText  = getCountdownText(task.deadline);   // 「あと〇日〇時間」などのテキストを生成する
            var cdClass = getCountdownClass(task.deadline);  // 残り日数から赤/オレンジ/緑/グレーのクラスを決める

            // 完了状態（task.done）に応じてボタンのクラスとテキストを切り替える
            // 古いデータで done フィールドが存在しない場合は未完了（false）として扱う
            var isDone    = !!task.done;                               // undefinedや0もfalseに統一する
            var doneClass = isDone ? 'btn-undone' : 'btn-done';       // 完了済みなら「未完了」ボタン、未完了なら「完了」ボタン
            var doneLabel = isDone ? '未完了' : '完了';                 // ボタンに表示するテキスト

            // 完了済みの場合は<li>に task-completed クラスを付与する（CSSで背景色・取り消し線を適用）
            if (isDone) {
                li.classList.add('task-completed'); // グレー背景と取り消し線を有効にする
            }

            // <li>の中身をHTMLで組み立てる
            // 左側：課題情報（授業名・課題名・期限・カウントダウン・提出方法）、右側：完了・編集・削除ボタン
            li.innerHTML =
                '<div class="task-info">' +                                                        // 課題情報をまとめるコンテナ開始
                  subjectHtml +                                                                    // 授業名（入力されている場合のみ科目色付きで表示）
                  '<span class="task-name">' + escapeHtml(task.name) + '</span>' +                // 課題名（XSS対策でエスケープ）
                  '<div class="task-detail">📅 期限：' + deadlineJP + '</div>' +                  // 期限を日本語表示
                  '<div class="task-countdown ' + cdClass + '" data-deadline="' + task.deadline + '">⏳ ' + cdText + '</div>' + // カウントダウン（data属性で期限を保持しupdateAllCountdowns()が更新できるようにする）
                  '<div class="task-detail">📬 提出方法：' + escapeHtml(task.method) + '</div>' + // 提出方法
                '</div>' +                                                                         // 課題情報コンテナ終了
                '<div class="btn-group">' +                                                        // ボタン群をまとめるコンテナ開始
                  '<button class="' + doneClass + '" onclick="toggleDone(this)">' + doneLabel + '</button>' + // 完了／未完了ボタン（thisでボタン自身を渡す）
                  '<button class="btn-edit" onclick="startEdit(this)">編集</button>' +            // 編集ボタン（thisでボタン自身を渡す）
                  '<button class="btn-delete" onclick="deleteTask(this)">削除</button>' +         // 削除ボタン（thisでボタン自身を渡す）
                '</div>';                                                                          // ボタン群コンテナ終了

            return li; // 生成した<li>要素を返す（追加先は呼び出し元が決める）
        }

        // -----------------------------------------------------------------
        // renderTask(task) : createTaskElement()で生成した<li>をリスト末尾に追加する
        // addTask() と loadTasks() から呼ばれる
        // -----------------------------------------------------------------
        function renderTask(task) {
            var li = createTaskElement(task);                      // 課題の<li>要素を生成する
            document.getElementById('taskList').appendChild(li);   // 課題リストの末尾に<li>を追加する
        }

        // -----------------------------------------------------------------
        // loadTasks() : ページ読み込み時にlocalStorageから保存済み課題を読み込んで表示する
        // -----------------------------------------------------------------
        function loadTasks() {
            var saved = localStorage.getItem(STORAGE_KEY); // localStorageからJSON文字列を取得する
            if (!saved) {  // 保存データがまだ存在しない場合（初回アクセス時など）
                return;    // 何もせずに終了する
            }

            var tasks = JSON.parse(saved); // JSON文字列をJavaScriptの配列に変換する
            if (tasks.length === 0) { // 配列が空（課題が0件）の場合も何もしない
                return;
            }

            // idフィールドを持たない古いデータに対してIDを付与する（過去データとの後方互換性のため）
            var needsResave = false;               // localStorageを保存し直すかどうかのフラグ
            for (var i = 0; i < tasks.length; i++) {
                if (!tasks[i].id) {                        // idが存在しない課題の場合
                    tasks[i].id = String(Date.now() + i);  // インデックスを加算して一意なIDを生成する
                    needsResave = true;                    // 保存し直しが必要と記録する
                }
            }
            if (needsResave) { // IDを付与した課題があった場合はlocalStorageを更新する
                localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
            }

            // 保存データがあるので「まだ登録されていません」メッセージを削除する
            var emptyMsg = document.getElementById('emptyMessage'); // メッセージ要素を取得
            if (emptyMsg) {    // 要素が存在する場合のみ削除（すでに削除済みなら何もしない）
                emptyMsg.remove(); // DOMから要素を取り除く
            }

            // 保存されていたすべての課題をループして1件ずつリストに表示する
            for (var j = 0; j < tasks.length; j++) { // インデックス0から順に末尾まで繰り返す
                renderTask(tasks[j]); // 課題オブジェクトをDOMに描画するヘルパーを呼ぶ
            }
        }

        // -----------------------------------------------------------------
        // addTask() : フォームの入力値を検証し、localStorageへ保存してリストに追加する
        // 「登録する」ボタンがクリックされたときに呼ばれる
        // -----------------------------------------------------------------
        function addTask() {
            // 各入力欄の値を取得し、前後の空白を除去する
            var subject      = document.getElementById('taskSubject').value.trim();  // 授業名（任意のため空白でも可）
            var name         = document.getElementById('taskName').value.trim();     // 課題名
            var deadlineDate = document.getElementById('taskDeadlineDate').value;    // 期限の日付部分（YYYY-MM-DD形式）
            var deadlineTime = document.getElementById('taskDeadlineTime').value;    // 期限の時刻部分（HH:MM形式、未入力可）
            // 日付と時刻を'T'で結合してYYYY-MM-DDTHH:MM形式にまとめる（時刻未入力は00:00で補完）
            var deadline     = deadlineDate + 'T' + (deadlineTime || '00:00');
            var method       = document.getElementById('taskMethod').value;          // 提出方法

            // 課題名が未入力の場合はアラートを出して処理を止める（授業名は任意なのでチェックしない）
            if (name === '') {
                alert('課題名を入力してください。'); // 未入力時の警告メッセージ
                return; // 以降の処理をキャンセルして関数を抜ける
            }

            // 期限の日付が未入力の場合はアラートを出して処理を止める（時刻は任意のため省略可）
            if (deadlineDate === '') {
                alert('期限の日付を選択してください。'); // 未入力時の警告メッセージ
                return; // 以降の処理をキャンセルして関数を抜ける
            }

            // 入力値をひとつの課題オブジェクトにまとめる
            var task = {
                id:       String(Date.now()), // 登録時刻のミリ秒を文字列化した一意なID（削除・編集時の特定に使う）
                subject:  subject,            // 授業名（空文字の場合はそのまま保存する）
                name:     name,               // 課題名
                deadline: deadline,           // 期限（YYYY-MM-DDTHH:MM形式のまま保存）
                method:   method,             // 提出方法
                done:     false               // 完了状態（新規登録時は必ず未完了にする）
            };

            // --- localStorageへの保存処理 ---
            var saved = localStorage.getItem(STORAGE_KEY);           // 既存の保存データを取得する
            var tasks = saved ? JSON.parse(saved) : [];               // データがあれば配列に変換、なければ空配列を用意する
            tasks.push(task);                                         // 新しい課題を配列の末尾に追加する
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); // 配列をJSON文字列に変換してlocalStorageへ書き込む

            // 「まだ登録されていません」メッセージが残っていれば削除する
            var emptyMsg = document.getElementById('emptyMessage'); // メッセージ要素を取得
            if (emptyMsg) {    // 要素が存在する場合のみ処理する
                emptyMsg.remove(); // DOMから要素を取り除く
            }

            renderTask(task); // 追加した課題を画面のリストに即時表示する

            refreshCalendarIfVisible(); // カレンダービューが開いていれば再描画して追加課題を反映する

            // 登録後、入力欄をリセットして次の入力を準備する
            document.getElementById('taskSubject').value        = '';  // 授業名の入力欄をクリアする
            document.getElementById('taskName').value           = '';  // 課題名の入力欄をクリアする
            document.getElementById('taskDeadlineDate').value   = '';  // 期限の日付入力欄をクリアする
            document.getElementById('taskDeadlineTime').value   = '';  // 期限の時刻入力欄をクリアする
            document.getElementById('taskMethod').selectedIndex = 0;   // 提出方法を先頭の選択肢に戻す
        }

        // -----------------------------------------------------------------
        // startEdit(btn) : 編集ボタンが押されたとき、課題データをフォームに読み込む
        // btn: クリックされた編集ボタン要素（onclick="startEdit(this)"で渡される）
        // -----------------------------------------------------------------
        function startEdit(btn) {
            var li = btn.closest('li');  // ボタンの祖先をたどって親の<li>要素を取得する
            var id = li.dataset.id;      // <li>のdata属性に紐付けたIDを取得する（編集対象を特定するため）

            // localStorageから対象IDに一致する課題オブジェクトを検索する
            var saved = localStorage.getItem(STORAGE_KEY); // 保存データをJSON文字列で取得する
            var tasks = saved ? JSON.parse(saved) : [];    // JSON文字列を配列に変換する
            var task  = null;                              // 見つかった課題を格納する変数
            for (var i = 0; i < tasks.length; i++) {       // 全課題をループして対象を探す
                if (tasks[i].id === id) {                  // IDが一致した課題を見つけたら
                    task = tasks[i];                       // 変数に代入する
                    break;                                 // ループを終了する
                }
            }
            if (!task) { // 課題が見つからなかった場合（通常は起こらない）
                return;  // 何もせずに終了する
            }

            // 保存済みの期限文字列（YYYY-MM-DDTHH:MM）を'T'で分割して日付と時刻を取り出す
            var dlParts  = task.deadline ? task.deadline.split('T') : ['', '']; // 'T'がない場合は空文字を2つ用意する
            var dlDate   = dlParts[0] || ''; // 日付部分（例："2026-05-27"）、存在しない場合は空文字
            var dlTime   = dlParts[1] || ''; // 時刻部分（例："23:59"）、存在しない場合は空文字

            // フォームの各入力欄に課題データを読み込む
            document.getElementById('taskSubject').value      = task.subject || ''; // 授業名をセットする（古いデータにはsubjectがないため||''で補完）
            document.getElementById('taskName').value         = task.name;          // 課題名をセットする
            document.getElementById('taskDeadlineDate').value = dlDate;             // 期限の日付部分をセットする
            document.getElementById('taskDeadlineTime').value = dlTime;             // 期限の時刻部分をセットする
            document.getElementById('taskMethod').value       = task.method;        // 提出方法をセットする

            // 現在編集中の課題IDをグローバル変数に記録する（updateTask()で使う）
            editingId = id;

            // 「登録する」ボタンを「更新する」ボタンに切り替える
            var submitBtn       = document.getElementById('submitBtn'); // ボタン要素を取得する
            submitBtn.textContent = '更新する';                          // ボタンのテキストを変更する
            submitBtn.onclick     = updateTask;                         // クリック時の関数をupdateTaskに切り替える

            // フォームの先頭にスクロールしてカーソルを置く（ユーザーが気づきやすくする）
            document.querySelector('.form-box').scrollIntoView({ behavior: 'smooth' }); // フォームエリアまでスクロールする
            document.getElementById('taskName').focus();                                 // 課題名の入力欄にフォーカスを移す
        }

        // -----------------------------------------------------------------
        // updateTask() : 編集内容でlocalStorageとDOMのリスト表示を更新する
        // 「更新する」ボタンがクリックされたときに呼ばれる
        // -----------------------------------------------------------------
        function updateTask() {
            // 各入力欄の現在値を取得し、前後の空白を除去する
            var subject      = document.getElementById('taskSubject').value.trim();  // 授業名（任意のため空白でも可）
            var name         = document.getElementById('taskName').value.trim();     // 課題名
            var deadlineDate = document.getElementById('taskDeadlineDate').value;    // 期限の日付部分（YYYY-MM-DD形式）
            var deadlineTime = document.getElementById('taskDeadlineTime').value;    // 期限の時刻部分（HH:MM形式、未入力可）
            // 日付と時刻を'T'で結合してYYYY-MM-DDTHH:MM形式にまとめる（時刻未入力は00:00で補完）
            var deadline     = deadlineDate + 'T' + (deadlineTime || '00:00');
            var method       = document.getElementById('taskMethod').value;          // 提出方法

            // 課題名が未入力の場合はアラートを出して処理を止める（授業名は任意なのでチェックしない）
            if (name === '') {
                alert('課題名を入力してください。'); // 未入力時の警告メッセージ
                return; // 以降の処理をキャンセルして関数を抜ける
            }

            // 期限の日付が未入力の場合はアラートを出して処理を止める（時刻は任意のため省略可）
            if (deadlineDate === '') {
                alert('期限の日付を選択してください。'); // 未入力時の警告メッセージ
                return; // 以降の処理をキャンセルして関数を抜ける
            }

            // --- localStorageの更新処理 ---
            var saved = localStorage.getItem(STORAGE_KEY);  // 保存データをJSON文字列で取得する
            var tasks = saved ? JSON.parse(saved) : [];      // JSON文字列を配列に変換する
            for (var i = 0; i < tasks.length; i++) {         // 全課題をループして編集対象を探す
                if (tasks[i].id === editingId) {              // IDが一致した課題を見つけたら
                    tasks[i].subject  = subject;              // 授業名を新しい値で上書きする
                    tasks[i].name     = name;                 // 課題名を新しい値で上書きする
                    tasks[i].deadline = deadline;             // 期限を新しい値で上書きする
                    tasks[i].method   = method;               // 提出方法を新しい値で上書きする
                    break;                                    // 更新完了したのでループを終了する
                }
            }
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); // 更新した配列をlocalStorageへ書き込む

            // --- DOMのリスト表示を更新する処理 ---
            // 対象の<li>要素を検索してselector（data-id属性）で取得する
            var oldLi = document.querySelector('#taskList li[data-id="' + editingId + '"]');
            if (oldLi) { // 対象の<li>が見つかった場合
                // 更新後の課題オブジェクトを使って新しい<li>要素を生成する
                var updatedTask = null;                        // 更新後の課題オブジェクトを格納する変数
                for (var j = 0; j < tasks.length; j++) {      // 全課題をループして更新対象を探す
                    if (tasks[j].id === editingId) {           // IDが一致した課題を見つけたら
                        updatedTask = tasks[j];                // 変数に代入する
                        break;                                 // ループを終了する
                    }
                }
                var newLi = createTaskElement(updatedTask); // 新しい<li>要素を生成する
                oldLi.replaceWith(newLi);                   // 古い<li>をその場で新しい<li>に差し替える（位置は変わらない）
            }

            // フォームの入力欄をリセットして次の新規登録を準備する
            document.getElementById('taskSubject').value        = '';  // 授業名の入力欄をクリアする
            document.getElementById('taskName').value           = '';  // 課題名の入力欄をクリアする
            document.getElementById('taskDeadlineDate').value   = '';  // 期限の日付入力欄をクリアする
            document.getElementById('taskDeadlineTime').value   = '';  // 期限の時刻入力欄をクリアする
            document.getElementById('taskMethod').selectedIndex = 0;   // 提出方法を先頭の選択肢に戻す

            // 「更新する」ボタンを「登録する」ボタンに戻す
            var submitBtn       = document.getElementById('submitBtn'); // ボタン要素を取得する
            submitBtn.textContent = '登録する';                          // ボタンのテキストを元に戻す
            submitBtn.onclick     = addTask;                            // クリック時の関数をaddTaskに戻す

            refreshCalendarIfVisible(); // カレンダービューが開いていれば再描画して更新内容を反映する

            // 編集モードを終了してグローバル変数をリセットする
            editingId = null; // nullに戻すことで次の操作が新規登録モードになる
        }

        // -----------------------------------------------------------------
        // toggleDone(btn) : 完了／未完了ボタンが押されたとき、完了状態を切り替える
        // btn: クリックされたボタン要素（onclick="toggleDone(this)"で渡される）
        // -----------------------------------------------------------------
        function toggleDone(btn) {
            var li = btn.closest('li'); // ボタンの祖先をたどって親の<li>要素を取得する
            var id = li.dataset.id;     // <li>のdata属性に紐付けたIDを取得する（更新対象を特定するため）

            // localStorageの該当課題の done フィールドを反転する
            var saved = localStorage.getItem(STORAGE_KEY); // 保存データをJSON文字列で取得する
            var tasks = saved ? JSON.parse(saved) : [];    // JSON文字列を配列に変換する
            for (var i = 0; i < tasks.length; i++) {       // 全課題をループして対象を探す
                if (tasks[i].id === id) {                  // IDが一致した課題を見つけたら
                    tasks[i].done = !tasks[i].done;        // trueならfalse、falseならtrueに反転する
                    break;                                 // 更新完了したのでループを終了する
                }
            }
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); // 更新した配列をlocalStorageへ書き込む

            // DOMを更新して見た目に完了状態を反映する
            // classList.toggle()はクラスを追加した場合にtrueを返す（＝完了になった）
            var nowDone = li.classList.toggle('task-completed'); // グレー背景・取り消し線のクラスを切り替える
            if (nowDone) {
                // 未完了→完了 の切り替え
                btn.textContent = '未完了';      // ボタンのテキストを「未完了」に変更する
                btn.className   = 'btn-undone'; // ボタンのクラスをグレー系に切り替える
            } else {
                // 完了→未完了 の切り替え
                btn.textContent = '完了';        // ボタンのテキストを「完了」に戻す
                btn.className   = 'btn-done';   // ボタンのクラスを緑系に戻す
            }

            refreshCalendarIfVisible(); // カレンダービューが開いていれば再描画して完了状態を反映する
        }

        // -----------------------------------------------------------------
        // deleteTask(btn) : 削除ボタンが押されたとき、課題をDOMとlocalStorageから削除する
        // btn: クリックされた削除ボタン要素（onclick="deleteTask(this)"で渡される）
        // -----------------------------------------------------------------
        function deleteTask(btn) {
            // 削除前に確認ダイアログを表示する
            // confirm()はOKがtrueを、キャンセルがfalseを返す
            if (!confirm('本当に削除しますか？')) { // キャンセルが押された場合
                return; // 何もせずに関数を終了して削除をキャンセルする
            }

            var li = btn.closest('li'); // ボタンの祖先をたどって親の<li>要素を取得する
            var id = li.dataset.id;     // <li>のdata属性に紐付けたIDを取得する（削除対象を特定するため）

            // 削除対象が現在編集中の課題だった場合はフォームと編集状態をリセットする
            if (id === editingId) {                                        // 編集中のIDと一致するか確認する
                document.getElementById('taskSubject').value        = '';     // 授業名の入力欄をクリアする
                document.getElementById('taskName').value           = '';     // 課題名の入力欄をクリアする
                document.getElementById('taskDeadlineDate').value   = '';     // 期限の日付入力欄をクリアする
                document.getElementById('taskDeadlineTime').value   = '';     // 期限の時刻入力欄をクリアする
                document.getElementById('taskMethod').selectedIndex = 0;     // 提出方法を先頭に戻す
                var submitBtn       = document.getElementById('submitBtn'); // ボタン要素を取得する
                submitBtn.textContent = '登録する';                          // ボタンのテキストを元に戻す
                submitBtn.onclick     = addTask;                            // クリック時の関数をaddTaskに戻す
                editingId = null;                                           // 編集モードを終了する
            }

            // localStorageから対象IDに一致する課題を除いた新しい配列を作成する
            var saved    = localStorage.getItem(STORAGE_KEY); // 保存データをJSON文字列で取得する
            var tasks    = saved ? JSON.parse(saved) : [];     // JSON文字列を配列に変換する
            var newTasks = tasks.filter(function (t) {         // filterで条件に合う要素だけ残す
                return t.id !== id;                            // IDが一致しない課題（＝削除対象以外）を残す
            });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(newTasks)); // 更新した配列をlocalStorageへ書き込む

            li.remove(); // DOMから<li>要素を削除して画面上の表示を消す

            refreshCalendarIfVisible(); // カレンダービューが開いていれば再描画して削除を反映する

            // 課題が0件になった場合は「まだ登録されていません」メッセージを再表示する
            var list = document.getElementById('taskList'); // <ul>要素を取得する
            if (list.children.length === 0) {               // 子要素（<li>）がひとつもない場合
                var emptyLi       = document.createElement('li'); // 新しい<li>を生成する
                emptyLi.id        = 'emptyMessage';               // 後で参照できるようIDを付ける
                emptyLi.className = 'empty-message';              // スタイルを適用するクラスを付ける
                emptyLi.textContent = 'まだ課題が登録されていません。'; // 表示するテキストを設定する
                list.appendChild(emptyLi);                        // <ul>にメッセージ<li>を追加する
            }
        }

        // -----------------------------------------------------------------
        // getSubjectColor(subject) : 授業名から決定論的に色を返す
        // subject: 授業名の文字列（空・未定義の場合はグレーを返す）
        // 同じ授業名は常に同じ色になる（ハッシュで配列インデックスを決定する）
        // -----------------------------------------------------------------
        function getSubjectColor(subject) {
            if (!subject || subject === '') return '#aaa'; // 授業名がなければグレーを返す

            var hash = 0;                                      // ハッシュ値の初期値
            for (var i = 0; i < subject.length; i++) {        // 授業名の各文字コードをハッシュに混ぜる
                hash = subject.charCodeAt(i) + ((hash << 5) - hash); // djb2アルゴリズムの変形（シンプルなハッシュ）
            }
            var index = Math.abs(hash) % SUBJECT_COLORS.length; // 配列の範囲内に収める
            return SUBJECT_COLORS[index];                       // 決定した色を返す
        }

        // -----------------------------------------------------------------
        // getCountdownText(deadlineStr) : 締め切りまでの残り時間をテキストで返す
        // deadlineStr: 'YYYY-MM-DDTHH:MM' 形式の文字列
        // 返り値: 「あと3日14時間」「あと5時間」「あと30分」「期限切れ」など
        // -----------------------------------------------------------------
        function getCountdownText(deadlineStr) {
            var now      = new Date();                  // 現在の日時（時刻込み）を取得する
            var deadline = new Date(deadlineStr);       // 期限文字列をDateオブジェクトに変換する
            var diffMs   = deadline - now;              // 現在から期限までのミリ秒差を計算する

            if (diffMs < 0) return '期限切れ';          // マイナスなら既に期限を超えている

            var diffMins  = Math.floor(diffMs / 60000);       // 残り分数を計算する（切り捨て）
            var diffHours = Math.floor(diffMins / 60);         // 残り時間数を計算する
            var diffDays  = Math.floor(diffHours / 24);        // 残り日数を計算する
            var remHours  = diffHours % 24;                    // 日以下の端数時間を計算する

            if (diffDays > 0) {
                // 1日以上ある場合：「あと〇日〇時間」を表示する（0時間は省略する）
                return 'あと' + diffDays + '日' + (remHours > 0 ? remHours + '時間' : '');
            }
            if (diffHours > 0) {
                return 'あと' + diffHours + '時間'; // 1時間以上24時間未満：「あと〇時間」を表示する
            }
            return 'あと' + diffMins + '分';        // 1時間未満：「あと〇分」を表示する
        }

        // -----------------------------------------------------------------
        // getCountdownClass(deadlineStr) : 残り日数に応じた緊急度クラスを返す
        // 返り値: 'countdown-urgent'（3日以内・赤）/ 'countdown-warning'（7日以内・オレンジ）
        //         / 'countdown-normal'（緑）/ 'countdown-overdue'（期限切れ・グレー）
        // -----------------------------------------------------------------
        function getCountdownClass(deadlineStr) {
            var now      = new Date();                  // 現在の日時を取得する
            var deadline = new Date(deadlineStr);       // 期限をDateオブジェクトに変換する
            var diffMs   = deadline - now;              // 残りミリ秒を計算する

            if (diffMs < 0) return 'countdown-overdue'; // 期限切れ

            var diffDays = diffMs / (1000 * 60 * 60 * 24); // ミリ秒を日数に変換する（小数点あり）
            if (diffDays <= 3) return 'countdown-urgent';   // 3日以内：赤
            if (diffDays <= 7) return 'countdown-warning';  // 7日以内：オレンジ
            return 'countdown-normal';                       // それ以外：緑
        }

        // -----------------------------------------------------------------
        // updateAllCountdowns() : 画面上のすべてのカウントダウン表示を最新の残り時間に更新する
        // setIntervalで1分ごとに呼ばれる
        // -----------------------------------------------------------------
        function updateAllCountdowns() {
            var els = document.querySelectorAll('.task-countdown'); // カウントダウン要素をすべて取得する
            for (var i = 0; i < els.length; i++) {                  // 全要素をループする
                var dl = els[i].dataset.deadline;                   // data-deadline属性から期限を取得する
                if (!dl) continue;                                  // 期限がない要素はスキップする
                els[i].textContent = '⏳ ' + getCountdownText(dl); // テキストを最新の残り時間に更新する
                els[i].className   = 'task-countdown ' + getCountdownClass(dl); // クラスを更新して色を変える
            }
        }

        // -----------------------------------------------------------------
        // saveMethods(methods) : 提出方法の配列をlocalStorageに保存する
        // methods: 文字列の配列
        // -----------------------------------------------------------------
        function saveMethods(methods) {
            localStorage.setItem(METHODS_KEY, JSON.stringify(methods)); // 配列をJSON文字列に変換して保存する
        }

        // -----------------------------------------------------------------
        // renderMethodSelect() : フォームのドロップダウンを最新の提出方法で再構築する
        // 現在選択中の値があればそれを維持し、削除された場合は先頭を選択する
        // -----------------------------------------------------------------
        function renderMethodSelect() {
            var saved   = localStorage.getItem(METHODS_KEY);              // 保存データを取得する
